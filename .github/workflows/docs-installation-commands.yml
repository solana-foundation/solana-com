name: Docs installation commands

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/content/docs/en/intro/installation/dependencies.mdx"
      - "apps/docs/content/docs/en/intro/installation/index.mdx"
      - "apps/docs/scripts/run-installation-commands.py"
      - ".github/workflows/docs-installation-commands.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/docs/content/docs/en/intro/installation/dependencies.mdx"
      - "apps/docs/content/docs/en/intro/installation/index.mdx"
      - "apps/docs/scripts/run-installation-commands.py"
      - ".github/workflows/docs-installation-commands.yml"
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List commands without running them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installation-commands:
    name: ${{ matrix.page.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        page:
          - name: /docs/intro/installation/dependencies
            path: apps/docs/content/docs/en/intro/installation/dependencies.mdx
          - name: /docs/intro/installation
            path: apps/docs/content/docs/en/intro/installation/index.mdx
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List terminal commands
        if: ${{ inputs.dry_run }}
        run:
          python3 apps/docs/scripts/run-installation-commands.py --dry-run "${{
          matrix.page.path }}"

      - name: Extract and run terminal commands
        if: ${{ !inputs.dry_run }}
        run:
          python3 apps/docs/scripts/run-installation-commands.py --execute "${{
          matrix.page.path }}"
