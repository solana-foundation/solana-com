name: media_auto_format

on:
  push:
    branches-ignore:
      - main
    paths:
      - "apps/media/content/**"
      - "apps/media/public/uploads/posts/**"
      - ".oxfmtrc.json"

# This workflow runs branch-controlled code (the lockfile's install scripts
# and apps/media/scripts) on every non-main branch push. That code must never
# see a write-capable token: the formatting job runs with read-only
# permissions and hands its output to a second job on a fresh runner, which
# commits through the REST API using the committing script from `main`, not
# from the branch.
permissions:
  contents: read

jobs:
  format-media-content:
    name: Auto Format Media Content
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install Safe Chain
        run: |
          npm install --global @aikidosec/safe-chain@1.5.26
          safe-chain setup-ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect changed media images
        id: changed-images
        shell: bash
        run: |
          files_path="$RUNNER_TEMP/changed-media-images.txt"
          before_sha="${{ github.event.before }}"

          if [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
            git ls-files -z -- \
              'apps/media/content/**/*.png' \
              'apps/media/content/**/*.jpg' \
              'apps/media/content/**/*.jpeg' \
              'apps/media/public/uploads/posts/**/*.png' \
              'apps/media/public/uploads/posts/**/*.jpg' \
              'apps/media/public/uploads/posts/**/*.jpeg' > "$files_path"
          elif git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
            git diff -z --name-only --diff-filter=ACMR "$before_sha" "${{ github.sha }}" -- \
              'apps/media/content/**/*.png' \
              'apps/media/content/**/*.jpg' \
              'apps/media/content/**/*.jpeg' \
              'apps/media/public/uploads/posts/**/*.png' \
              'apps/media/public/uploads/posts/**/*.jpg' \
              'apps/media/public/uploads/posts/**/*.jpeg' > "$files_path"
          else
            echo "Previous commit $before_sha is unavailable in the local clone. Falling back to tracked media images from HEAD."
            git diff -z --name-only --diff-filter=ACMR HEAD^ HEAD -- \
              'apps/media/content/**/*.png' \
              'apps/media/content/**/*.jpg' \
              'apps/media/content/**/*.jpeg' \
              'apps/media/public/uploads/posts/**/*.png' \
              'apps/media/public/uploads/posts/**/*.jpg' \
              'apps/media/public/uploads/posts/**/*.jpeg' > "$files_path" \
              || git ls-files -z -- \
                'apps/media/content/**/*.png' \
                'apps/media/content/**/*.jpg' \
                'apps/media/content/**/*.jpeg' \
                'apps/media/public/uploads/posts/**/*.png' \
                'apps/media/public/uploads/posts/**/*.jpg' \
                'apps/media/public/uploads/posts/**/*.jpeg' > "$files_path"
          fi

          if [ -s "$files_path" ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Optimize changed media images
        if: steps.changed-images.outputs.has_files == 'true'
        shell: bash
        run: |
          xargs -0 pnpm media:optimize-images -- < "$RUNNER_TEMP/changed-media-images.txt"

      - name: Format media content
        run: pnpm exec oxfmt apps/media/content

      - name: Collect formatted files
        id: formatted
        shell: bash
        # Image optimisation writes a .webp and deletes the original, so
        # deletions travel as a list and the archive only holds files that exist.
        run: |
          set -euo pipefail
          git add -N apps/media/content apps/media/public/uploads/posts
          if git diff --quiet -- apps/media/content apps/media/public/uploads/posts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          out="$RUNNER_TEMP/formatted"
          mkdir -p "$out"
          git diff --name-only --diff-filter=D -- apps/media/content apps/media/public/uploads/posts > "$out/deleted.txt"
          git diff --name-only --diff-filter=d -- apps/media/content apps/media/public/uploads/posts > "$out/present.txt"
          if [ -s "$out/present.txt" ]; then
            tar -cf "$out/changes.tar" -T "$out/present.txt"
          fi
          rm -f "$out/present.txt"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload formatted files
        if: steps.formatted.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-format-${{ github.run_id }}
          path: ${{ runner.temp }}/formatted
          retention-days: 1
    outputs:
      changed: ${{ steps.formatted.outputs.changed }}

  commit-media-content:
    name: Commit formatted media content
    needs: format-media-content
    if: needs.format-media-content.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The exact commit the formatting ran on. If the branch has moved
          # since, the committing script refuses the stale head and the newer
          # push's own run formats the newer content.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Download formatted files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: media-format-${{ github.run_id }}
          path: ${{ runner.temp }}/formatted

      - name: Apply formatted files
        shell: bash
        run: |
          set -euo pipefail
          in="$RUNNER_TEMP/formatted"
          allowed() {
            case "$1" in
              apps/media/content/*|apps/media/public/uploads/posts/*) return 0 ;;
              *) echo "Refusing unexpected path in artifact: $1" >&2; return 1 ;;
            esac
          }
          # Every path, deleted or archived, must stay inside the media content trees.
          if [ -s "$in/deleted.txt" ]; then
            while IFS= read -r f; do [ -n "$f" ] && allowed "$f"; done < "$in/deleted.txt"
          fi
          if [ -f "$in/changes.tar" ]; then
            tar -tf "$in/changes.tar" | while IFS= read -r f; do allowed "$f"; done
          fi
          if [ -s "$in/deleted.txt" ]; then
            while IFS= read -r f; do [ -n "$f" ] && rm -f "$GITHUB_WORKSPACE/$f"; done < "$in/deleted.txt"
          fi
          if [ -f "$in/changes.tar" ]; then
            tar -xf "$in/changes.tar" -C "$GITHUB_WORKSPACE"
          fi

      - name: Commit verified formatting changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Run the committing script from `main`, never the branch's copy, and no
        # branch code (install scripts, media scripts) has run on this runner.
        run: |
          set -euo pipefail
          git show origin/main:scripts/github/create-verified-commit.mjs > "$RUNNER_TEMP/create-verified-commit.mjs"
          node "$RUNNER_TEMP/create-verified-commit.mjs" \
            "chore(media): auto-format media content" \
            apps/media/content \
            apps/media/public/uploads/posts
