name: media_auto_format

on:
  push:
    branches-ignore:
      - main
    paths:
      - "apps/media/content/**"
      - "apps/media/public/uploads/posts/**"
      - ".oxfmtrc.json"

# This workflow runs branch-controlled code (the lockfile's install scripts
# and apps/media/scripts) on every non-main branch push, so the write-capable
# token is only exposed to the single step that commits through the REST API.
permissions:
  contents: read

jobs:
  format-media-content:
    name: Auto Format Media Content
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install Safe Chain
        run: |
          npm install --global @aikidosec/safe-chain@1.5.26
          safe-chain setup-ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect changed media images
        id: changed-images
        shell: bash
        run: |
          files_path="$RUNNER_TEMP/changed-media-images.txt"
          before_sha="${{ github.event.before }}"

          if [ "$before_sha" = "0000000000000000000000000000000000000000" ]; then
            git ls-files -z -- \
              'apps/media/content/**/*.png' \
              'apps/media/content/**/*.jpg' \
              'apps/media/content/**/*.jpeg' \
              'apps/media/public/uploads/posts/**/*.png' \
              'apps/media/public/uploads/posts/**/*.jpg' \
              'apps/media/public/uploads/posts/**/*.jpeg' > "$files_path"
          elif git cat-file -e "${before_sha}^{commit}" 2>/dev/null; then
            git diff -z --name-only --diff-filter=ACMR "$before_sha" "${{ github.sha }}" -- \
              'apps/media/content/**/*.png' \
              'apps/media/content/**/*.jpg' \
              'apps/media/content/**/*.jpeg' \
              'apps/media/public/uploads/posts/**/*.png' \
              'apps/media/public/uploads/posts/**/*.jpg' \
              'apps/media/public/uploads/posts/**/*.jpeg' > "$files_path"
          else
            echo "Previous commit $before_sha is unavailable in the local clone. Falling back to tracked media images from HEAD."
            git diff -z --name-only --diff-filter=ACMR HEAD^ HEAD -- \
              'apps/media/content/**/*.png' \
              'apps/media/content/**/*.jpg' \
              'apps/media/content/**/*.jpeg' \
              'apps/media/public/uploads/posts/**/*.png' \
              'apps/media/public/uploads/posts/**/*.jpg' \
              'apps/media/public/uploads/posts/**/*.jpeg' > "$files_path" \
              || git ls-files -z -- \
                'apps/media/content/**/*.png' \
                'apps/media/content/**/*.jpg' \
                'apps/media/content/**/*.jpeg' \
                'apps/media/public/uploads/posts/**/*.png' \
                'apps/media/public/uploads/posts/**/*.jpg' \
                'apps/media/public/uploads/posts/**/*.jpeg' > "$files_path"
          fi

          if [ -s "$files_path" ]; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Optimize changed media images
        if: steps.changed-images.outputs.has_files == 'true'
        shell: bash
        run: |
          xargs -0 pnpm media:optimize-images -- < "$RUNNER_TEMP/changed-media-images.txt"

      - name: Format media content
        run: pnpm exec oxfmt apps/media/content

      - name: Commit verified formatting changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/github/create-verified-commit.mjs \
            "chore(media): auto-format media content" \
            apps/media/content \
            apps/media/public/uploads/posts
