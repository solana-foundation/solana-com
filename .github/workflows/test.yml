name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --max-old-space-size=8192
  TURBO_SCM_BASE:
    ${{ github.event.pull_request.base.sha || github.event.before }}
  TURBO_SCM_HEAD: ${{ github.sha }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-ci-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-ci-

      - name: Set fs.inotify
        run: sudo sysctl -w fs.inotify.max_user_watches=524288

      - name: Install Safe Chain
        run: |
          npm install --global @aikidosec/safe-chain
          safe-chain setup-ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run:
          pnpm exec turbo run check-types --affected --framework-inference=false

      - name: Run tests
        run:
          pnpm exec turbo run test --affected
          --filter='!@workspace/docs-examples' --framework-inference=false
