name: Docs examples

on:
  push:
    branches: [main]
    paths:
      - "packages/docs-examples/**"
      - "apps/docs/content/cookbook/**"
      - ".github/workflows/docs-examples.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/docs-examples/**"
      - "apps/docs/content/cookbook/**"
      - ".github/workflows/docs-examples.yml"

permissions:
  contents: read

env:
  SOLANA_CLI_VERSION: v4.3.2
  SOLANA_CLI_INSTALL_SHA256: 6a8219038bb02ff89b8798e015081ea48760068603dc8214e48066a57a1e45e9
  NODE_OPTIONS: --max-old-space-size=8192
  SURFPOOL_REF: 88e9333b

jobs:
  examples-ts:
    name: TypeScript examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Cache Solana CLI
        id: solana-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/solana/install
          key: solana-cli-${{ env.SOLANA_CLI_VERSION }}-${{ runner.os }}-v1

      - name: Install Solana CLI
        if: steps.solana-cache.outputs.cache-hit != 'true'
        # Pinned release; the installer script is checksum-verified before it
        # runs. Bump both values together. To recompute the checksum:
        #   curl -sSfL https://release.anza.xyz/${SOLANA_CLI_VERSION}/install | shasum -a 256
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/agave-install.sh" \
            "https://release.anza.xyz/${SOLANA_CLI_VERSION}/install"
          echo "${SOLANA_CLI_INSTALL_SHA256}  $RUNNER_TEMP/agave-install.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/agave-install.sh"

      - name: Add Solana CLI to PATH
        run:
          echo "$HOME/.local/share/solana/install/active_release/bin" >>
          "$GITHUB_PATH"

      - name: Verify solana-keygen
        run: solana-keygen --version

      - name: Install Safe Chain
        run: |
          npm install --global @aikidosec/safe-chain@1.5.26
          safe-chain setup-ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run docs-examples tests
        run: pnpm --filter @workspace/docs-examples test

      - name: Lint
        run: pnpm --filter @workspace/docs-examples lint

  examples-rust:
    name: Rust examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/docs-examples

      - name: Cache surfpool binary
        id: surfpool-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/surfpool
          key: surfpool-${{ runner.os }}-${{ env.SURFPOOL_REF }}

      - name: Install surfpool
        if: steps.surfpool-cache.outputs.cache-hit != 'true'
        run:
          cargo install --git https://github.com/txtx/surfpool --rev ${{
          env.SURFPOOL_REF }} --locked surfpool-cli

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: cargo check
        working-directory: packages/docs-examples
        run: cargo check --workspace

      - name: Run every Rust example against surfpool
        run: bash packages/docs-examples/scripts/run-rust-examples.sh

  examples-python:
    name: Python examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The runner starts surfpool through the @solana/surfpool SDK
      # (scripts/surfnet.mjs), the same build the TypeScript suite uses.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install Safe Chain
        run: |
          npm install --global @aikidosec/safe-chain@1.5.26
          safe-chain setup-ci

      - name: Install docs-examples dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/docs-examples

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: packages/docs-examples/requirements.txt

      - name: Install dependencies
        run: pip install -r packages/docs-examples/requirements.txt

      - name: Run every Python example against surfpool
        run: bash packages/docs-examples/scripts/run-python-examples.sh

  examples-go:
    name: Go examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The runner starts surfpool through the @solana/surfpool SDK
      # (scripts/surfnet.mjs), the same build the TypeScript suite uses.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install Safe Chain
        run: |
          npm install --global @aikidosec/safe-chain@1.5.26
          safe-chain setup-ci

      - name: Install docs-examples dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/docs-examples

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: packages/docs-examples/go.mod
          cache-dependency-path: packages/docs-examples/go.sum

      - name: Run every Go example against surfpool
        run: bash packages/docs-examples/scripts/run-go-examples.sh
