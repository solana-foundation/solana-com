name: Publish fab-menu

on:
  workflow_dispatch:
  push:
    tags:
      - "fab-menu-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish @solana-foundation/fab-menu
    # Only a fab-menu-v* tag may publish; a manual dispatch on any other ref
    # exits here without touching the registry. Required reviewers for the
    # environment are configured in repository settings (see
    # docs/security/admin-gaps.md).
    if: startsWith(github.ref, 'refs/tags/fab-menu-v')
    runs-on: ubuntu-latest
    environment: fab-menu-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "@solana-foundation"

      - name: Install Safe Chain
        run: |
          npm install --global @aikidosec/safe-chain@1.5.26
          safe-chain setup-ci

      - name: Install dependencies
        run:
          pnpm --filter @solana-foundation/fab-menu... install --frozen-lockfile

      - name: Check package version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/fab-menu/package.json').version")
          TAG_VERSION=${GITHUB_REF_NAME#fab-menu-v}
          test "$PACKAGE_VERSION" = "$TAG_VERSION"

      - name: Build package
        run: pnpm --filter @solana-foundation/fab-menu build

      - name: Publish package
        run: pnpm --filter @solana-foundation/fab-menu publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
