name: Generate LLMs.txt

on:
  workflow_dispatch: # Manual trigger
  schedule:
    # Run every 7 days at 2:03 AM UTC
    - cron: "3 2 */7 * *"

permissions:
  contents: read

jobs:
  generate-llms-txt:
    name: Generate LLMs.txt file
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Generate LLMs.txt
        run: |
          python llmtxt-generator.py
          echo "LLMs.txt file generated"

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch-token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          commit-message: "Update LLMs.txt via automated workflow"
          title: "Update LLMs.txt file"
          body: "Auto-generated PR to update LLMs.txt file"
          branch: "automated-llms-txt-update"
          base: main
          maintainer-can-modify: true
          delete-branch: true
      - name: Verify pull request commits
        if:
          steps.create-pr.outputs.pull-request-operation != 'none' &&
          steps.create-pr.outputs.pull-request-commits-verified != 'true'
        run: |
          echo "Pull request commits were not verified by GitHub."
          exit 1
