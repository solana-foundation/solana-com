name: Generate LLMs.txt

on:
  workflow_dispatch: # Manual trigger
  schedule:
    # Run every 7 days at 2:03 AM UTC
    - cron: "3 2 */7 * *"

permissions:
  contents: read

jobs:
  generate-llms-txt:
    name: Generate LLMs.txt file
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Generate LLMs.txt
        run: |
          python llmtxt-generator.py
          echo "LLMs.txt file generated"

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch-token: ${{ secrets.GITHUB_TOKEN }}
          sign-commits: true
          commit-message: "Update LLMs.txt via automated workflow"
          title: "Update LLMs.txt file"
          body: "Auto-generated PR to update LLMs.txt file"
          branch: "automated-llms-txt-update"
          base: main
          maintainer-can-modify: true
          delete-branch: true
      - name: Verify pull request commits
        if:
          steps.create-pr.outputs.pull-request-operation != 'none' &&
          steps.create-pr.outputs.pull-request-commits-verified != 'true'
        run: |
          echo "Pull request commits were not verified by GitHub."
          exit 1
