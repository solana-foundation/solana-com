name: Docs examples — deps drift

# Bumps every JS dep in packages/docs-examples to its latest version and runs
# the suite. The point is to catch SDK breakage early — if @solana/kit or one
# of the spl-token packages publishes a release that breaks our cookbook
# snippets, this surfaces the failure on its own schedule rather than the next
# time someone touches the docs.

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLANA_CLI_VERSION: v4.3.2
  SOLANA_CLI_INSTALL_SHA256: 6a8219038bb02ff89b8798e015081ea48760068603dc8214e48066a57a1e45e9
  NODE_OPTIONS: --max-old-space-size=8192

jobs:
  examples-ts-latest:
    name: TypeScript examples (latest deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Cache Solana CLI
        id: solana-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/solana/install
          key: solana-cli-${{ env.SOLANA_CLI_VERSION }}-${{ runner.os }}-v1

      - name: Install Solana CLI
        if: steps.solana-cache.outputs.cache-hit != 'true'
        # Pinned release; the installer script is checksum-verified before it
        # runs. Bump both values together. To recompute the checksum:
        #   curl -sSfL https://release.anza.xyz/${SOLANA_CLI_VERSION}/install | shasum -a 256
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/agave-install.sh" \
            "https://release.anza.xyz/${SOLANA_CLI_VERSION}/install"
          echo "${SOLANA_CLI_INSTALL_SHA256}  $RUNNER_TEMP/agave-install.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/agave-install.sh"

      - name: Add Solana CLI to PATH
        run:
          echo "$HOME/.local/share/solana/install/active_release/bin" >>
          "$GITHUB_PATH"

      # Armed before both the baseline install and the `pnpm update --latest`
      # bump below — newly published packages are exactly where supply-chain
      # malware lands, so this drift job is the highest-value place to scan.
      - name: Install Safe Chain
        run: |
          npm install --global @aikidosec/safe-chain@1.5.26
          safe-chain setup-ci

      - name: Install baseline deps
        run: pnpm install --frozen-lockfile

      - name: Bump docs-examples deps to latest
        working-directory: packages/docs-examples
        run: pnpm update --latest

      - name: Show resolved versions
        working-directory: packages/docs-examples
        run: pnpm ls --depth=0

      - name: Run docs-examples tests
        run: pnpm --filter @workspace/docs-examples test

      - name: Lint
        run: pnpm --filter @workspace/docs-examples lint
