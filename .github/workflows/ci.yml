name: CI

# One job, one install. `pnpm check` runs format, lint, type check and tests
# and reports every failure in a single run. Pull requests check what the diff
# can reach; main checks every workspace.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_OPTIONS: --max-old-space-size=8192
  TURBO_SCM_BASE:
    ${{ github.event.pull_request.base.sha || github.event.before }}
  TURBO_SCM_HEAD: ${{ github.sha }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Restore Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-ci-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-ci-

      - name: Set fs.inotify
        run: sudo sysctl -w fs.inotify.max_user_watches=524288

      - name: Install Safe Chain
        run: |
          npm install --global @aikidosec/safe-chain@1.5.26
          safe-chain setup-ci

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check affected workspaces
        if: github.event_name == 'pull_request'
        run: pnpm check --affected

      - name: Check every workspace
        if: github.event_name != 'pull_request'
        run: pnpm check
