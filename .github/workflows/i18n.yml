name: Lingo.dev i18n

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/i18n.yml"
      - ".lingo/config.json"
      - "scripts/i18n/**"
      - "packages/i18n/messages/*/en/*.json"
      - "apps/docs/content/docs/en/**/*.mdx"
      - "apps/docs/content/docs/en/**/meta.json"
      - "!apps/docs/content/docs/en/rpc/**"
      - "apps/docs/content/learn/en/**/*.mdx"
      - "apps/docs/content/learn/en/**/meta.json"
      - "apps/docs/content/developers-learn/en/**/*.mdx"
      - "apps/docs/content/developers-learn/en/**/meta.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  i18n:
    name: Run continuous localization
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      # run.mjs verifies the Lingo config, pushes with bounded retries and
      # recovery, then verifies target coverage and docs frontmatter itself.
      - name: Run Lingo.dev
        env:
          LINGO_API_KEY:
            ${{ secrets.LINGO_API_KEY || secrets.LINGODOTDEV_API_KEY }}
          # Below the job's timeout-minutes so every Lingo command, retry, and
          # recovery finishes with headroom left for creating the pull request.
          LINGO_JOB_TIMEOUT_MINUTES: 300
        run: node scripts/i18n/run.mjs all
      - name: Create signed pull request
        id: create-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          sign-commits: true
          commit-message: "i18n: Lingo Translation Update"
          title: "i18n: Lingo"
          body:
            "Automated Lingo.dev translation update for UI catalogs and docs
            content."
          branch: i18n/lingo
          base: main
          delete-branch: true
          add-paths: |
            packages/i18n/messages
            apps/docs/content
            .lingo/lock.json
      - name: Verify pull request commits
        if:
          steps.create-pr.outputs.pull-request-operation != 'none' &&
          steps.create-pr.outputs.pull-request-commits-verified != 'true'
        run: |
          echo "Pull request commits were not verified by GitHub."
          exit 1
