name: Lingo.dev i18n

# Translates English source changes after they reach main, then opens a PR that
# merges itself once CI passes. Failed runs and manual fixes are covered in
# apps/docs/CONTRIBUTING.md#i18n-localization.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/i18n.yml"
      - ".lingo/config.json"
      - "scripts/i18n/**"
      - "packages/i18n/messages/*/en/*.json"
      - "apps/docs/content/docs/en/**/*.mdx"
      - "apps/docs/content/docs/en/**/meta.json"
      - "!apps/docs/content/docs/en/rpc/**"
      - "apps/web/content/learn/en/**/*.mdx"
      - "apps/web/content/learn/en/**/meta.json"
      - "apps/docs/content/developers-learn/en/**/*.mdx"
      - "apps/docs/content/developers-learn/en/**/meta.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-main
  cancel-in-progress: true

env:
  LINGO_CLI_VERSION: 1.16.0

jobs:
  i18n:
    name: Run continuous localization
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install Lingo.dev CLI
        run: |
          npm install --global --no-audit --no-fund "@lingo.dev/cli@${LINGO_CLI_VERSION}"
          lingo --version
      - name: Localize and validate
        timeout-minutes: 305
        env:
          LINGO_CLI_BIN: lingo
          LINGO_API_KEY:
            ${{ secrets.LINGO_API_KEY || secrets.LINGODOTDEV_API_KEY }}
        run: |
          timeout --verbose --signal=TERM --kill-after=30s \
            300m node scripts/i18n/run.mjs all
      - name: Check changes are translation outputs only
        id: scope
        run: |
          locales=$(jq -r '.targetLocales | join("|")' .lingo/config.json)
          unexpected=$(git status --porcelain --untracked-files=all -- \
            packages/i18n/messages apps/docs/content apps/web/content/learn \
            .lingo/lock.json |
            cut -c4- |
            grep -vE "^(\.lingo/lock\.json|((packages/i18n/messages|apps/docs/content)/[^/]+|apps/web/content/learn)/($locales)/.+)$" ||
            true)
          if [ -n "$unexpected" ]; then
            echo "::warning::Leaving the PR for review; it changes files outside target locales:"
            echo "$unexpected"
          fi
          echo "auto-merge=$([ -z "$unexpected" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # A GITHUB_TOKEN push would not trigger CI, and GitHub Actions cannot
      # approve a pull request it opened, so the docs checker app opens it.
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.DOCS_CHECKER_APP_ID }}
          private-key: ${{ secrets.DOCS_CHECKER_APP_PRIVATE_KEY }}
      - name: Create signed pull request
        id: create-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          commit-message: "i18n: Lingo Translation Update"
          title: "i18n: Lingo"
          body:
            "Automated Lingo.dev translation update for UI catalogs and docs
            content."
          # Not i18n/lingo: GitHub Actions opened the PRs there and cannot approve them.
          branch: i18n/lingo-auto
          base: main
          delete-branch: true
          add-paths: |
            packages/i18n/messages
            apps/docs/content
            apps/web/content/learn
            .lingo/lock.json
      - name: Verify pull request commits
        if:
          steps.create-pr.outputs.pull-request-operation != 'none' &&
          steps.create-pr.outputs.pull-request-operation != 'closed' &&
          steps.create-pr.outputs.pull-request-commits-verified != 'true'
        run: |
          echo "Pull request commits were not verified by GitHub."
          exit 1
      # Approving needs "Allow GitHub Actions to create and approve pull
      # requests" enabled; otherwise the PR stays open for a manual review.
      # An unchanged open PR is retried too, so a rerun can finish a merge.
      - name: Merge once checks pass
        if:
          steps.create-pr.outputs.pull-request-number != '' &&
          steps.create-pr.outputs.pull-request-operation != 'closed' &&
          steps.scope.outputs.auto-merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.create-pr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.create-pr.outputs.pull-request-head-sha }}
        run: |
          sleep 60
          gh pr checks "$PR" --watch --fail-fast --interval 60
          # --watch exits 0 for cancelled checks, so require pass or skipped.
          gh pr checks "$PR" --json bucket \
            --jq 'all(.[]; .bucket == "pass" or .bucket == "skipping")' |
            grep -qx true
          gh api "repos/$GH_REPO/pulls/$PR/reviews" \
            -f commit_id="$HEAD_SHA" -f event=APPROVE --silent
          gh pr merge "$PR" --squash --match-head-commit "$HEAD_SHA"
      - name: Require manual review
        if:
          steps.create-pr.outputs.pull-request-number != '' &&
          steps.create-pr.outputs.pull-request-operation != 'closed' &&
          steps.scope.outputs.auto-merge != 'true'
        env:
          PR: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          echo "::error::PR #$PR changes files outside target locales, so it was not merged. Review and merge it by hand."
          exit 1
