name: Lingo.dev i18n

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/i18n.yml"
      - ".lingo/config.json"
      - "scripts/i18n/**"
      - "packages/i18n/messages/*/en/*.json"
      - "apps/docs/content/docs/en/**/*.mdx"
      - "apps/docs/content/docs/en/**/meta.json"
      - "!apps/docs/content/docs/en/rpc/**"
      - "apps/docs/content/learn/en/**/*.mdx"
      - "apps/docs/content/learn/en/**/meta.json"
      - "apps/docs/content/developers-learn/en/**/*.mdx"
      - "apps/docs/content/developers-learn/en/**/meta.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  i18n:
    name: Run continuous localization
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Keep an hour of headroom for runner startup and post-Lingo checks.
      LINGO_JOB_TIMEOUT_MINUTES: 300
    steps:
      - name: Record job deadline
        run: |
          job_deadline_seconds=$(( $(date +%s) + LINGO_JOB_TIMEOUT_MINUTES * 60 ))
          echo "LINGO_JOB_DEADLINE_MS=$(( job_deadline_seconds * 1000 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify Lingo source configuration
        run: |
          node scripts/i18n/verify-source-locales.mjs
          node scripts/i18n/verify-config-coverage.mjs
      - name: Run Lingo.dev
        env:
          LINGO_API_KEY:
            ${{ secrets.LINGO_API_KEY || secrets.LINGODOTDEV_API_KEY }}
          LINGO_WAIT_TIMEOUT_MINUTES: 210
        run: node scripts/i18n/run.mjs all
      - name: Normalize generated docs frontmatter
        run: node scripts/i18n/sanitize-docs-frontmatter.mjs
      - name: Verify Lingo target coverage
        run: node scripts/i18n/verify-target-coverage.mjs
      - name: Verify docs frontmatter
        run: node scripts/i18n/verify-docs-frontmatter.mjs
      - name: Create signed pull request
        id: create-pr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          sign-commits: true
          commit-message: "i18n: Lingo Translation Update"
          title: "i18n: Lingo"
          body:
            "Automated Lingo.dev translation update for UI catalogs and docs
            content."
          branch: i18n/lingo
          base: main
          delete-branch: true
          add-paths: |
            packages/i18n/messages
            apps/docs/content
            .lingo/lock.json
      - name: Verify pull request commits
        if:
          steps.create-pr.outputs.pull-request-operation != 'none' &&
          steps.create-pr.outputs.pull-request-commits-verified != 'true'
        run: |
          echo "Pull request commits were not verified by GitHub."
          exit 1
