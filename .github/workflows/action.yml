name: node_js
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TURBO_SCM_BASE:
    ${{ github.event.pull_request.base.sha || github.event.before }}
  TURBO_SCM_HEAD: ${{ github.sha }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Set fs.inotify
        run: sudo sysctl -w fs.inotify.max_user_watches=524288
      - name: Install Safe Chain
        run: |
          npm install --global @aikidosec/safe-chain
          safe-chain setup-ci
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm exec prettier --ignore-path .prettierignore --check .

  lint-apps:
    name: Lint App - ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - solana-com
          - solana-com-accelerate
          - solana-com-breakpoint
          - solana-com-media
          - solana-docs
          - solana-templates
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ matrix.workspace }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ matrix.workspace }}-
      - name: Set fs.inotify
        run: sudo sysctl -w fs.inotify.max_user_watches=524288
      - name: Install Safe Chain
        run: |
          npm install --global @aikidosec/safe-chain
          safe-chain setup-ci
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint workspace
        run:
          pnpm exec turbo run lint --affected --only --framework-inference=false
          --filter='${{ matrix.workspace }}'

  lint-packages:
    name: Lint Package - ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@solana-com/ui-chrome"
          - "@workspace/ecosystem-data"
          - "@workspace/i18n"
          - "@workspace/sentry"
          - "@workspace/ui"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ matrix.workspace }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ matrix.workspace }}-
      - name: Set fs.inotify
        run: sudo sysctl -w fs.inotify.max_user_watches=524288
      - name: Install Safe Chain
        run: |
          npm install --global @aikidosec/safe-chain
          safe-chain setup-ci
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint workspace
        run:
          pnpm exec turbo run lint --affected --only --framework-inference=false
          --filter='${{ matrix.workspace }}'
