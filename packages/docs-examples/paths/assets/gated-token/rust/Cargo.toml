# The Rust tab of the tokenization tutorials: one binary per step, sharing the
# helpers in src/lib.rs and src/acl.rs. Standalone (its own [workspace]): the
# tutorial scripts need the tutorial's key files and $MINT, so the runner that
# executes every docs-examples workspace binary must not pick them up.
# gated-token.test.ts builds and runs them against a local Surfnet.
[package]
name = "gated-token"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
solana-account-decoder-client-types = "4"
solana-client = "=4.2.2"
solana-commitment-config = "3"
solana-sdk = "4"
solana-system-interface = "3"
spl-token-2022-interface = "3"
spl-token-metadata-interface = "1"
