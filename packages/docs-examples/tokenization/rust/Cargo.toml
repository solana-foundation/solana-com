# Standalone crate, deliberately outside the docs-examples Cargo workspace:
# the tutorials run against devnet with the tutorial's keypairs and $MINT, so
# the CI runner that executes every workspace binary against surfpool must
# not pick these up. Build and run from this directory or with
# --manifest-path; see ../README.md.
[package]
name = "tokenization-examples"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

# One binary per tutorial step, discovered from src/bin/<step>.rs.

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
solana-account-decoder-client-types = "4"
solana-client = "=4.2.2"
solana-commitment-config = "3"
solana-sdk = "4"
solana-system-interface = "3"
spl-token-2022-interface = "3"
spl-token-metadata-interface = "1"
