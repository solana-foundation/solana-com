<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title">
  <title id="title">Byte layout of a version 1 off-chain message: signing domain, version, signer count, sorted signer public keys, and UTF-8 content, wrapped in an envelope of signatures</title>
  <style>
    .label{fill:#172033;font:600 21px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.label-small{fill:#172033;font:600 17px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.meta{fill:#5b6678;font:15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.mono{fill:#5b6678;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}.mono-sm{fill:#5b6678;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace}.edge{fill:#5b6678;font:600 13px Diatype,Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.3px}.hdr{fill:#5b6678;font:600 14px Diatype,Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.9px}.good{fill:#059669;font:600 15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.warn{fill:#b45309;font:600 15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.line,.arrow{fill:none;stroke:#667085;stroke-width:2}.rule{fill:none;stroke:#667085;stroke-width:1;opacity:.3}
  </style>
  <text class="hdr" x="40" y="40">MESSAGE (WHAT THE WALLET SIGNS)</text>
  <rect x="40" y="62" width="300" height="96" rx="10" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text class="label-small" x="56" y="92">Signing domain</text>
  <text class="edge" x="56" y="116">16 bytes</text>
  <text class="mono" x="56" y="140">\xffsolana offchain</text>
  <rect x="340" y="62" width="130" height="96" rx="10" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text class="label-small" x="356" y="92">Version</text>
  <text class="edge" x="356" y="116">1 byte</text>
  <text class="mono" x="356" y="140">1</text>
  <rect x="470" y="62" width="150" height="96" rx="10" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text class="label-small" x="486" y="92">Signer count</text>
  <text class="edge" x="486" y="116">1 byte</text>
  <text class="mono" x="486" y="140">n</text>
  <rect x="620" y="62" width="250" height="96" rx="10" fill="none" stroke="#0284c7" stroke-width="2"/>
  <text class="label-small" x="636" y="92">Signers</text>
  <text class="edge" x="636" y="116">n × 32 bytes</text>
  <text class="mono" x="636" y="140">sorted, unique</text>
  <rect x="870" y="62" width="290" height="96" rx="10" fill="none" stroke="#059669" stroke-width="2"/>
  <text class="label-small" x="886" y="92">Content</text>
  <text class="edge" x="886" y="116">remainder</text>
  <text class="mono" x="886" y="140">UTF-8 text</text>
  <text class="mono-sm" x="44" y="178">0x00</text>
  <text class="mono-sm" x="344" y="178">0x10</text>
  <text class="mono-sm" x="474" y="178">0x11</text>
  <text class="mono-sm" x="624" y="178">0x12</text>
  <text class="hdr" x="40" y="236">ENVELOPE (WHAT YOU STORE OR SEND)</text>
  <rect x="40" y="258" width="220" height="72" rx="10" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <text class="label-small" x="56" y="288">Signature count</text>
  <text class="edge" x="56" y="312">1 byte</text>
  <rect x="260" y="258" width="400" height="72" rx="10" fill="none" stroke="#0284c7" stroke-width="2"/>
  <text class="label-small" x="276" y="288">Signatures</text>
  <text class="edge" x="276" y="312">n × 64 bytes, in signer order</text>
  <rect x="660" y="258" width="500" height="72" rx="10" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="label-small" x="676" y="288">Message</text>
  <text class="edge" x="676" y="312">the bytes above</text>
</svg>
