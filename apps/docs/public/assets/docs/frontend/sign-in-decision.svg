<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title">
  <title id="title">Choosing a sign-in method: use off-chain message signing when the wallet supports it, otherwise fall back to signMessage, and let hardware wallet users opt into a sign-in transaction</title>
  <style>
    .label{fill:#f8fafc;font:600 21px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.label-small{fill:#f8fafc;font:600 17px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.meta{fill:#a8b3c2;font:15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.mono{fill:#a8b3c2;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}.mono-sm{fill:#a8b3c2;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace}.edge{fill:#a8b3c2;font:600 13px Diatype,Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.3px}.hdr{fill:#a8b3c2;font:600 14px Diatype,Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.9px}.good{fill:#34d399;font:600 15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.warn{fill:#fbbf24;font:600 15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.line,.arrow{fill:none;stroke:#a8b3c3;stroke-width:2}.rule{fill:none;stroke:#a8b3c3;stroke-width:1;opacity:.3}
  </style>
  <g>
    <rect x="385" y="40" width="430" height="76" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text class="label" x="403" y="72">Wallet connected</text>
    <text class="meta" x="403" y="98">Read the account's features</text>
  </g>
  <path class="line" d="M600 116V160"/>
  <path class="arrow" d="M593 150L600 160L607 150"/>
  <g>
    <rect x="335" y="160" width="530" height="76" rx="12" fill="none" stroke="#a8b3c3" stroke-width="2" stroke-dasharray="6 5"/>
    <text class="label" x="353" y="192">Supports signOffchainMessage v1?</text>
    <text class="mono" x="353" y="218">solana:signOffchainMessage</text>
  </g>
  <path class="line" d="M335 198H270V300"/>
  <path class="arrow" d="M263 290L270 300L277 290"/>
  <text class="edge" x="282" y="190">YES</text>
  <path class="line" d="M865 198H930V300"/>
  <path class="arrow" d="M923 290L930 300L937 290"/>
  <text class="edge" x="880" y="190">NO</text>
  <g>
    <rect x="40" y="300" width="460" height="98" rx="12" fill="none" stroke="#34d399" stroke-width="2"/>
    <text class="label" x="58" y="332">Sign an off-chain message</text>
    <text class="meta" x="58" y="358">Readable text on every device,</text>
    <text class="meta" x="58" y="380">hardware wallets included</text>
  </g>
  <g>
    <rect x="700" y="300" width="460" height="98" rx="12" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text class="label" x="718" y="332">Sign a raw message</text>
    <text class="meta" x="718" y="358">solana:signMessage for software wallets</text>
    <text class="meta" x="718" y="380">Same challenge, raw bytes</text>
  </g>
  <path class="line" d="M930 398V470"/>
  <path class="arrow" d="M923 460L930 470L937 460"/>
  <text class="edge" x="944" y="440">USER OPTS IN: HARDWARE WALLET</text>
  <g>
    <rect x="700" y="470" width="460" height="98" rx="12" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5"/>
    <text class="label" x="718" y="502">Sign a sign-in transaction</text>
    <text class="meta" x="718" y="528">No message support on the device</text>
    <text class="meta" x="718" y="550">Costs a fee and RPC round trips</text>
  </g>
</svg>
