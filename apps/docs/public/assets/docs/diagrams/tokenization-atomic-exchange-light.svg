<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title">
  <title id="title">Both legs of an exchange settle in one transaction</title>
  <style>.h{fill:#172033;font:600 17px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.m{fill:#5b6678;font:15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.s{fill:#5b6678;font:14px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.ht{fill:#047857;font:600 15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.ho{fill:#5b6678;font:italic 15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.g{fill:#5b6678;font:600 13px Diatype,Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em}.ln{fill:none;stroke:#667085;stroke-width:2}.lnd{fill:none;stroke:#667085;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect x="16" y="40" width="270" height="96" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="h" x="151.0" y="75.0" text-anchor="middle">DvP program</text>
  <text class="m" x="151.0" y="94.0" text-anchor="middle">Escrow per leg,</text>
  <text class="m" x="151.0" y="113.0" text-anchor="middle">settlement authority signs</text>
  <rect x="16" y="156" width="270" height="96" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="h" x="151.0" y="191.0" text-anchor="middle">Extensions-only pattern</text>
  <text class="m" x="151.0" y="210.0" text-anchor="middle">Delegated authority,</text>
  <text class="m" x="151.0" y="229.0" text-anchor="middle">no custom program</text>
  <rect x="326" y="24" width="350" height="248" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="g" x="501" y="54" text-anchor="middle">ONE TRANSACTION</text>
  <rect x="350" y="74" width="302" height="60" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="h" x="501.0" y="110.0" text-anchor="middle">Asset leg: seller to buyer</text>
  <rect x="350" y="146" width="302" height="60" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="h" x="501.0" y="182.0" text-anchor="middle">Cash leg: buyer to seller</text>
  <text class="m" x="501" y="240" text-anchor="middle">Both transfers take effect, or neither</text>
  <path class="ln" d="M286 88 L324 88"/>
  <path class="ln" d="M315 82 L324 88 L315 94"/>
  <path class="ln" d="M286 204 L324 204"/>
  <path class="ln" d="M315 198 L324 204 L315 210"/>
  <path class="lnd" d="M676 148 L712 148"/>
  <path class="ln" d="M703 142 L712 148 L703 154"/>
  <rect x="714" y="92" width="230" height="112" rx="12" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="h" x="829.0" y="125.5" text-anchor="middle">Off-chain register</text>
  <text class="m" x="829.0" y="144.5" text-anchor="middle">Where one governs:</text>
  <text class="m" x="829.0" y="163.5" text-anchor="middle">updated in a</text>
  <text class="m" x="829.0" y="182.5" text-anchor="middle">separate step</text>
</svg>
