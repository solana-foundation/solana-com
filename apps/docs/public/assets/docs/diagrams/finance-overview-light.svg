<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="312" viewBox="0 10 1200 312" role="img" aria-labelledby="title">
  <title id="title">Assets are created through issuance and used in payments and markets</title>
  <style>
    .label{fill:#172033;font:600 21px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.meta{fill:#5b6678;font:15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.group{fill:#667085;font:600 13px Diatype,Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.09em}.line,.arrow{fill:none;stroke:#667085;stroke-width:2}
  </style>
  <path class="line" d="M360 180H480V100H600M480 180V260H600"/><path class="arrow" d="M590 93L600 100L590 107M590 253L600 260L590 267"/>
  <text class="group" x="600" y="30">CREATE</text><path d="M672 25H1140" stroke="#667085" stroke-width="1" opacity=".45"/><text class="group" x="600" y="188">USE</text><path d="M644 183H1140" stroke="#667085" stroke-width="1" opacity=".45"/>
  <g><rect x="60" y="110" width="300" height="140" rx="12" fill="none" stroke="#7c3aed" stroke-width="2"/><text class="label" x="210" y="168" text-anchor="middle" style="font-size:23px">Assets</text><text class="meta" x="210" y="198" text-anchor="middle">tokens + ownership</text></g>
  <g><rect x="600" y="40" width="250" height="120" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/><text class="label" x="725" y="88" text-anchor="middle">Issuance &amp;</text><text class="label" x="725" y="112" text-anchor="middle">Tokenization</text><text class="meta" x="725" y="138" text-anchor="middle">create assets</text></g>
  <g><rect x="890" y="40" width="250" height="120" rx="12" fill="none" stroke="#0284c7" stroke-width="2"/><text class="label" x="1015" y="98" text-anchor="middle">Institutional</text><text class="meta" x="1015" y="128" text-anchor="middle">issue under supervision</text></g>
  <g><rect x="600" y="200" width="250" height="120" rx="12" fill="none" stroke="#0f8b78" stroke-width="2"/><text class="label" x="725" y="258" text-anchor="middle">Payments</text><text class="meta" x="725" y="288" text-anchor="middle">move value</text></g>
  <g><rect x="890" y="200" width="250" height="120" rx="12" fill="none" stroke="#059669" stroke-width="2"/><text class="label" x="1015" y="248" text-anchor="middle">Markets &amp;</text><text class="label" x="1015" y="272" text-anchor="middle">trading</text><text class="meta" x="1015" y="298" text-anchor="middle">price value</text></g>
</svg>
