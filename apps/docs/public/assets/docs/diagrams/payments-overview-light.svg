<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="144" viewBox="0 108 1200 144" role="img" aria-labelledby="title">
  <title id="title">A payment on Solana</title>
  <style>
    .label{fill:#172033;font:600 22px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.meta{fill:#5b6678;font:15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.line,.arrow{fill:none;stroke:#667085;stroke-width:2}
  </style>
  <path class="line" d="M230 180H270M470 180H510M710 180H750M950 180H990"/><path class="arrow" d="M260 173L270 180L260 187M500 173L510 180L500 187M740 173L750 180L740 187M980 173L990 180L980 187"/>
  <g><rect x="30" y="110" width="200" height="140" rx="12" fill="none" stroke="#7c3aed" stroke-width="2"/><text class="label" x="130" y="170" text-anchor="middle">Request</text><text class="meta" x="130" y="199" text-anchor="middle">amount + asset</text></g>
  <g><rect x="270" y="110" width="200" height="140" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/><text class="label" x="370" y="170" text-anchor="middle">Wallet</text><text class="meta" x="370" y="199" text-anchor="middle">reviews + signs</text></g>
  <g><rect x="510" y="110" width="200" height="140" rx="12" fill="none" stroke="#0284c7" stroke-width="2"/><text class="label" x="610" y="170" text-anchor="middle">Transfer</text><text class="meta" x="610" y="199" text-anchor="middle">settles on Solana</text></g>
  <g><rect x="750" y="110" width="200" height="140" rx="12" fill="none" stroke="#0f8b78" stroke-width="2"/><text class="label" x="850" y="170" text-anchor="middle">Merchant</text><text class="meta" x="850" y="199" text-anchor="middle">receives funds</text></g>
  <g><rect x="990" y="110" width="180" height="140" rx="12" fill="none" stroke="#059669" stroke-width="2"/><text class="label" x="1080" y="170" text-anchor="middle">Verify</text><text class="meta" x="1080" y="199" text-anchor="middle">reconcile receipt</text></g>
</svg>
