      <stop offset=".55" stop-color="#4f63c8"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </radialGradient>
  </defs>
  <style>
    .heading{fill:#172033;font:600 30px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.body{fill:#5b6678;font:18px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.connector{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-linecap:round}.node{fill:none;stroke-width:2;stroke-linejoin:round}
