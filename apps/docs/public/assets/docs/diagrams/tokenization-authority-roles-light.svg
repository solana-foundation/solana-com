  <text class="m" x="98.0" y="414.0" text-anchor="middle">delegate</text>
  <path class="ln" d="M166 400 L190 400"/>
  <path class="ln" d="M181 394 L190 400 L181 406"/>
  <rect x="192" y="356" width="282" height="88" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="h" x="208" y="385.5" text-anchor="start">Legal and compliance</text>
  <text class="h" x="208" y="407.5" text-anchor="start">quorum, offline</text>
  <text class="m" x="208" y="426.5" text-anchor="start">Move or burn any holder's balance</text>
