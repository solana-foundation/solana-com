  <text class="m" x="208" y="210.0" text-anchor="start">Change name, symbol, URI</text>
  <text class="m" x="208" y="229.0" text-anchor="start">and additional fields</text>
  <rect x="30" y="274" width="136" height="56" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="m" x="98.0" y="306.5" text-anchor="middle">Pausable</text>
  <path class="ln" d="M166 302 L190 302"/>
  <path class="ln" d="M181 296 L190 302 L181 308"/>
  <rect x="192" y="258" width="282" height="88" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="h" x="208" y="278.0" text-anchor="start">Incident response,</text>
  <text class="h" x="208" y="300.0" text-anchor="start">reachable 24/7</text>
  <text class="m" x="208" y="319.0" text-anchor="start">Halt all mint, burn,</text>
