  <rect x="492" y="176" width="136" height="56" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="m" x="560.0" y="199.0" text-anchor="middle">Confidential</text>
  <text class="m" x="560.0" y="218.0" text-anchor="middle">Balances</text>
  <path class="ln" d="M628 204 L652 204"/>
  <path class="ln" d="M643 198 L652 204 L643 210"/>
