  <text class="m" x="670" y="229.0" text-anchor="start">transfer settings</text>
  <rect x="492" y="274" width="136" height="56" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="m" x="560.0" y="297.0" text-anchor="middle">Freeze</text>
  <text class="m" x="560.0" y="316.0" text-anchor="middle">via Token ACL</text>
  <path class="ln" d="M628 302 L652 302"/>
  <path class="ln" d="M643 296 L652 302 L643 308"/>
  <rect x="654" y="258" width="282" height="88" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="h" x="670" y="278.0" text-anchor="start">Delegated to the</text>
  <text class="h" x="670" y="300.0" text-anchor="start">ACL program</text>
  <text class="m" x="670" y="319.0" text-anchor="start">Freeze and thaw accounts,</text>
  <text class="m" x="670" y="338.0" text-anchor="start">with issuer override</text>
