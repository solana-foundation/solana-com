<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Apps connect to the Solana network</title>
  <desc id="desc">Payment, game, and market apps connect to Solana, a network made up of computers working together.</desc>
  <defs>
    <linearGradient id="network-gradient" x1="90" y1="230" x2="1110" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9945ff"/>
      <stop offset=".48" stop-color="#21d4fd"/>
      <stop offset="1" stop-color="#14f195"/>
    </linearGradient>
    <linearGradient id="solana-mark-gradient" x1="2.561" y1="27.642" x2="27.258" y2="-.397" gradientUnits="userSpaceOnUse">
      <stop offset=".08" stop-color="#9945ff"/>
      <stop offset=".3" stop-color="#8752f3"/>
      <stop offset=".5" stop-color="#5497d5"/>
      <stop offset=".6" stop-color="#43b4ca"/>
      <stop offset=".72" stop-color="#28e0b9"/>
      <stop offset=".97" stop-color="#19fb9b"/>
    </linearGradient>
    <radialGradient id="connection-gradient">
      <stop stop-color="#21d4fd"/>
      <stop offset=".55" stop-color="#6a7cff"/>
      <stop offset="1" stop-color="#9945ff"/>
    </radialGradient>
    <filter id="network-glow" x="-12%" y="-35%" width="124%" height="170%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <style>
    .heading{fill:#f4f6fb;font:600 30px Diatype,Helvetica,sans-serif}.body{fill:#a2a9b8;font:18px Diatype,Helvetica,sans-serif}.connector{fill:none;stroke:#343a4c;stroke-width:1.5;stroke-linecap:round}.node{fill:#0b0718;stroke-width:2;stroke-linejoin:round}
  </style>

  <text class="heading" x="600" y="55" text-anchor="middle">Apps</text>
  <text class="body" x="600" y="91" text-anchor="middle">payments · games · markets</text>
  <path class="connector" d="M600 121V190"/>
  <circle cx="600" cy="190" r="18" fill="url(#connection-gradient)" opacity=".12" filter="url(#network-glow)"/>

  <rect x="90" y="190" width="1020" height="220" rx="82" fill="#151024" opacity=".55" filter="url(#network-glow)"/>
  <rect x="90" y="190" width="1020" height="220" rx="82" fill="#0b0718" stroke="url(#network-gradient)" stroke-width="2"/>
