<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" role="img" aria-labelledby="title">
  <title id="title">How Token ACL thaws a frozen holder account through a gate program</title>
  <style>.h{fill:#f8fafc;font:600 17px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.m{fill:#a8b3c2;font:15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.s{fill:#a8b3c2;font:14px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.ht{fill:#34d399;font:600 15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.ho{fill:#a8b3c2;font:italic 15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.g{fill:#a8b3c2;font:600 13px Diatype,Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em}.ln{fill:none;stroke:#a8b3c2;stroke-width:2}.lnd{fill:none;stroke:#a8b3c2;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect x="24" y="18" width="34" height="18" rx="5" fill="none" stroke="#34d399" stroke-width="3"/>
  <text class="s" x="68" y="32" text-anchor="start">Set up in this tutorial</text>
  <rect x="254" y="18" width="34" height="18" rx="5" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="s" x="298" y="32" text-anchor="start">Not configured in this tutorial</text>
  <rect x="24" y="60" width="300" height="74" rx="12" fill="none" stroke="#34d399" stroke-width="3"/>
  <text class="h" x="174.0" y="93.5" text-anchor="middle">Token-2022 mint</text>
  <text class="m" x="174.0" y="112.5" text-anchor="middle">Default Account State: Frozen</text>
  <path class="ln" d="M324 97 L380 97"/>
  <path class="ln" d="M371 91 L380 97 L371 103"/>
  <rect x="382" y="60" width="300" height="74" rx="12" fill="none" stroke="#34d399" stroke-width="3"/>
  <text class="h" x="532.0" y="93.5" text-anchor="middle">New holder token account</text>
  <text class="m" x="532.0" y="112.5" text-anchor="middle">Opens frozen</text>
  <path class="ln" d="M532 134 L532 196"/>
  <path class="ln" d="M526 187 L532 196 L538 187"/>
  <text class="ht" x="546" y="160" text-anchor="start">Permissionless thaw</text>
  <text class="s" x="546" y="180" text-anchor="start">Anyone can submit it</text>
  <rect x="382" y="198" width="300" height="104" rx="12" fill="none" stroke="#34d399" stroke-width="3"/>
  <text class="h" x="532.0" y="228.0" text-anchor="middle">Token ACL program</text>
  <text class="m" x="532.0" y="247.0" text-anchor="middle">Holds the delegated freeze authority</text>
  <text class="m" x="532.0" y="266.0" text-anchor="middle">through a per-mint config</text>
  <text class="s" x="532.0" y="284.0" text-anchor="middle">Does not decide who qualifies</text>
  <rect x="24" y="198" width="300" height="48" rx="12" fill="none" stroke="#34d399" stroke-width="3"/>
  <text class="m" x="174.0" y="226.5" text-anchor="middle">Mint config: permissionless thaw on</text>
  <rect x="24" y="254" width="300" height="48" rx="12" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="m" x="174.0" y="282.5" text-anchor="middle">Permissionless freeze: optional, off</text>
  <path class="ln" d="M324 222 L380 222"/>
  <path class="ln" d="M371 216 L380 222 L371 228"/>
  <path class="lnd" d="M324 278 L380 278"/>
  <path class="ln" d="M371 272 L380 278 L371 284"/>
  <rect x="24" y="316" width="658" height="70" rx="12" fill="none" stroke="#34d399" stroke-width="3"/>
  <text class="h" x="353.0" y="347.5" text-anchor="middle">Config authority (fee payer here)</text>
  <text class="m" x="353.0" y="366.5" text-anchor="middle">Freezes or thaws directly, swaps the gate program, reclaims the freeze authority</text>
  <path class="ln" d="M532 316 L532 304"/>
  <path class="ln" d="M526 313 L532 304 L538 313"/>
  <path class="ln" d="M682 250 L748 250 L748 410"/>
  <path class="ln" d="M742 401 L748 410 L754 401"/>
  <text class="s" x="760" y="300" text-anchor="start">Asks the gate</text>
  <rect x="560" y="412" width="376" height="330" rx="12" fill="none" stroke="#34d399" stroke-width="3"/>
  <text class="h" x="748" y="442" text-anchor="middle">Gate program (one per mint config)</text>
  <text class="m" x="748" y="464" text-anchor="middle">Approves or rejects the thaw</text>
  <rect x="578" y="480" width="340" height="62" rx="12" fill="none" stroke="#34d399" stroke-width="3"/>
  <text class="h" x="594" y="507.5" text-anchor="start">Address-based list, allowlist mode</text>
  <text class="m" x="594" y="526.5" text-anchor="start">Qualifies if the wallet is on the list</text>
  <rect x="578" y="550" width="340" height="62" rx="12" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="h" x="594" y="577.5" text-anchor="start">Blocklist mode</text>
  <text class="m" x="594" y="596.5" text-anchor="start">Every wallet qualifies except listed ones</text>
  <rect x="578" y="620" width="340" height="80" rx="12" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="h" x="594" y="647.0" text-anchor="start">Custom gate</text>
  <text class="m" x="594" y="666.0" text-anchor="start">Issuer-written logic, for example</text>
  <text class="m" x="594" y="685.0" text-anchor="start">onchain identity or KYC checks</text>
  <text class="s" x="748" y="726" text-anchor="middle">Several lists: a thaw needs every list to allow it</text>
  <text class="g" x="36" y="430" text-anchor="start">WHO UPDATES THE LIST</text>
  <rect x="24" y="474" width="300" height="76" rx="12" fill="none" stroke="#34d399" stroke-width="3"/>
  <text class="h" x="174.0" y="499.0" text-anchor="middle">List operator</text>
  <text class="m" x="174.0" y="518.0" text-anchor="middle">Issuer, transfer agent or provider</text>
  <text class="m" x="174.0" y="537.0" text-anchor="middle">adds and removes wallets</text>
  <path class="ln" d="M324 511 L576 511"/>
  <path class="ln" d="M567 505 L576 511 L567 517"/>
  <rect x="24" y="590" width="145" height="66" rx="12" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="m" x="96.5" y="618.5" text-anchor="middle">Off-chain checks</text>
  <text class="s" x="96.5" y="636.5" text-anchor="middle">KYC, sanctions</text>
  <rect x="179" y="590" width="145" height="66" rx="12" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="m" x="251.5" y="618.5" text-anchor="middle">Attestation</text>
  <text class="s" x="251.5" y="636.5" text-anchor="middle">can drive updates</text>
  <path class="lnd" d="M96 590 L96 552"/>
  <path class="ln" d="M90 561 L96 552 L102 561"/>
  <path class="lnd" d="M252 590 L252 552"/>
  <path class="ln" d="M246 561 L252 552 L258 561"/>
  <path class="ln" d="M640 742 L640 776"/>
  <path class="ln" d="M634 767 L640 776 L646 767"/>
  <path class="ln" d="M856 742 L856 776"/>
  <path class="ln" d="M850 767 L856 776 L862 767"/>
  <rect x="382" y="778" width="290" height="88" rx="12" fill="none" stroke="#34d399" stroke-width="3"/>
  <text class="h" x="527.0" y="809.0" text-anchor="middle">Approved: account thawed</text>
  <text class="m" x="527.0" y="828.0" text-anchor="middle">Later transfers are ordinary</text>
  <text class="m" x="527.0" y="847.0" text-anchor="middle">Token-2022 transfers</text>
  <rect x="686" y="778" width="250" height="88" rx="12" fill="none" stroke="#34d399" stroke-width="3"/>
  <text class="h" x="811.0" y="809.0" text-anchor="middle">Not approved</text>
  <text class="m" x="811.0" y="828.0" text-anchor="middle">Account stays frozen,</text>
  <text class="m" x="811.0" y="847.0" text-anchor="middle">the transaction fails</text>
</svg>
