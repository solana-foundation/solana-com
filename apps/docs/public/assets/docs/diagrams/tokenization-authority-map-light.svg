<svg xmlns="http://www.w3.org/2000/svg" width="960" height="860" viewBox="0 0 960 860" role="img" aria-labelledby="title">
  <title id="title">Token-2022 authority map for the tokenized-security mint</title>
  <style>.h{fill:#172033;font:600 17px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.m{fill:#5b6678;font:15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.s{fill:#5b6678;font:14px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.ht{fill:#047857;font:600 15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.ho{fill:#5b6678;font:italic 15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.g{fill:#5b6678;font:600 13px Diatype,Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em}.ln{fill:none;stroke:#667085;stroke-width:2}.lnd{fill:none;stroke:#667085;stroke-width:2;stroke-dasharray:6 5}</style>
  <rect x="24" y="18" width="34" height="18" rx="5" fill="none" stroke="#059669" stroke-width="3"/>
  <text class="s" x="68" y="32" text-anchor="start">Set up in this tutorial</text>
  <rect x="254" y="18" width="34" height="18" rx="5" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="s" x="298" y="32" text-anchor="start">Not configured in this tutorial</text>
  <rect x="16" y="56" width="928" height="568" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="g" x="36" y="84" text-anchor="start">TOKEN-2022 MINT, TOKENIZED-SECURITY TEMPLATE</text>
  <rect x="30" y="120" width="136" height="56" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="m" x="98.0" y="152.5" text-anchor="middle">Mint supply</text>
  <path class="ln" d="M166 148 L190 148"/>
  <path class="ln" d="M181 142 L190 148 L181 154"/>
  <rect x="192" y="102" width="282" height="92" rx="12" fill="none" stroke="#059669" stroke-width="3"/>
  <text class="h" x="208" y="135.0" text-anchor="start">Mint authority</text>
  <text class="m" x="208" y="154.0" text-anchor="start">Creates supply</text>
  <text class="ht" x="208" y="173.0" text-anchor="start">Fee payer</text>
  <rect x="30" y="222" width="136" height="56" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="m" x="98.0" y="254.5" text-anchor="middle">Freeze and thaw</text>
  <path class="ln" d="M166 250 L190 250"/>
  <path class="ln" d="M181 244 L190 250 L181 256"/>
  <rect x="192" y="204" width="282" height="92" rx="12" fill="none" stroke="#059669" stroke-width="3"/>
  <text class="h" x="208" y="237.0" text-anchor="start">Freeze authority</text>
  <text class="m" x="208" y="256.0" text-anchor="start">Freezes and thaws accounts</text>
  <text class="ht" x="208" y="275.0" text-anchor="start">Token ACL mint config (PDA)</text>
  <rect x="30" y="324" width="136" height="56" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="m" x="98.0" y="347.0" text-anchor="middle">Default Account</text>
  <text class="m" x="98.0" y="366.0" text-anchor="middle">State</text>
  <path class="ln" d="M166 352 L190 352"/>
  <path class="ln" d="M181 346 L190 352 L181 358"/>
  <rect x="192" y="306" width="282" height="92" rx="12" fill="none" stroke="#059669" stroke-width="3"/>
  <text class="h" x="208" y="339.0" text-anchor="start">No separate authority</text>
  <text class="m" x="208" y="358.0" text-anchor="start">Updated by the freeze authority</text>
  <text class="ht" x="208" y="377.0" text-anchor="start">State: Frozen</text>
  <rect x="30" y="426" width="136" height="56" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="m" x="98.0" y="449.0" text-anchor="middle">Confidential</text>
  <text class="m" x="98.0" y="468.0" text-anchor="middle">Balances</text>
  <path class="ln" d="M166 454 L190 454"/>
  <path class="ln" d="M181 448 L190 454 L181 460"/>
  <rect x="192" y="408" width="282" height="92" rx="12" fill="none" stroke="#059669" stroke-width="3"/>
  <text class="h" x="208" y="431.5" text-anchor="start">Confidential transfer authority</text>
  <text class="m" x="208" y="450.5" text-anchor="start">Configures settings and</text>
  <text class="m" x="208" y="469.5" text-anchor="start">approves accounts</text>
  <text class="ht" x="208" y="488.5" text-anchor="start">Fee payer</text>
  <rect x="30" y="528" width="136" height="56" rx="12" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="m" x="98.0" y="560.5" text-anchor="middle">Transfer Hook</text>
  <path class="lnd" d="M166 556 L190 556"/>
  <path class="ln" d="M181 550 L190 556 L181 562"/>
  <rect x="192" y="510" width="282" height="92" rx="12" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="h" x="208" y="543.0" text-anchor="start">Transfer hook authority</text>
  <text class="m" x="208" y="562.0" text-anchor="start">Sets the hook program ID</text>
  <text class="ho" x="208" y="581.0" text-anchor="start">Not in this template</text>
  <rect x="492" y="120" width="136" height="56" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="m" x="560.0" y="143.0" text-anchor="middle">Permanent</text>
  <text class="m" x="560.0" y="162.0" text-anchor="middle">Delegate</text>
  <path class="ln" d="M628 148 L652 148"/>
  <path class="ln" d="M643 142 L652 148 L643 154"/>
  <rect x="654" y="102" width="282" height="92" rx="12" fill="none" stroke="#059669" stroke-width="3"/>
  <text class="h" x="670" y="125.5" text-anchor="start">Permanent delegate</text>
  <text class="m" x="670" y="144.5" text-anchor="start">Moves or burns any</text>
  <text class="m" x="670" y="163.5" text-anchor="start">holder's balance</text>
  <text class="ht" x="670" y="182.5" text-anchor="start">Delegate key</text>
  <rect x="492" y="222" width="136" height="56" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="m" x="560.0" y="245.0" text-anchor="middle">Permissioned</text>
  <text class="m" x="560.0" y="264.0" text-anchor="middle">Burn</text>
  <path class="ln" d="M628 250 L652 250"/>
  <path class="ln" d="M643 244 L652 250 L643 256"/>
  <rect x="654" y="204" width="282" height="92" rx="12" fill="none" stroke="#059669" stroke-width="3"/>
  <text class="h" x="670" y="237.0" text-anchor="start">Permissioned burn authority</text>
  <text class="m" x="670" y="256.0" text-anchor="start">Co-signs every burn</text>
  <text class="ht" x="670" y="275.0" text-anchor="start">Burn key</text>
  <rect x="492" y="324" width="136" height="56" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="m" x="560.0" y="356.5" text-anchor="middle">Pausable</text>
  <path class="ln" d="M628 352 L652 352"/>
  <path class="ln" d="M643 346 L652 352 L643 358"/>
  <rect x="654" y="306" width="282" height="92" rx="12" fill="none" stroke="#059669" stroke-width="3"/>
  <text class="h" x="670" y="339.0" text-anchor="start">Pause authority</text>
  <text class="m" x="670" y="358.0" text-anchor="start">Halts mint, burn and transfer</text>
  <text class="ht" x="670" y="377.0" text-anchor="start">Pause key</text>
  <rect x="492" y="426" width="136" height="56" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="m" x="560.0" y="458.5" text-anchor="middle">Scaled UI Amount</text>
  <path class="ln" d="M628 454 L652 454"/>
  <path class="ln" d="M643 448 L652 454 L643 460"/>
  <rect x="654" y="408" width="282" height="92" rx="12" fill="none" stroke="#059669" stroke-width="3"/>
  <text class="h" x="670" y="431.5" text-anchor="start">Multiplier authority</text>
  <text class="m" x="670" y="450.5" text-anchor="start">Changes the displayed-</text>
  <text class="m" x="670" y="469.5" text-anchor="start">balance multiplier</text>
  <text class="ht" x="670" y="488.5" text-anchor="start">Fee payer</text>
  <rect x="492" y="528" width="136" height="56" rx="12" fill="none" stroke="#6d5bd0" stroke-width="2"/>
  <text class="m" x="560.0" y="560.5" text-anchor="middle">Metadata</text>
  <path class="ln" d="M628 556 L652 556"/>
  <path class="ln" d="M643 550 L652 556 L643 562"/>
  <rect x="654" y="510" width="282" height="92" rx="12" fill="none" stroke="#059669" stroke-width="3"/>
  <text class="h" x="670" y="533.5" text-anchor="start">Metadata authorities</text>
  <text class="m" x="670" y="552.5" text-anchor="start">Metadata update and</text>
  <text class="m" x="670" y="571.5" text-anchor="start">metadata pointer</text>
  <text class="ht" x="670" y="590.5" text-anchor="start">Metadata key</text>
  <text class="g" x="36" y="662" text-anchor="start">TOKEN ACL AND GATE, OUTSIDE THE MINT</text>
  <rect x="24" y="676" width="452" height="98" rx="12" fill="none" stroke="#059669" stroke-width="3"/>
  <text class="h" x="40" y="702.5" text-anchor="start">Token ACL config authority</text>
  <text class="m" x="40" y="721.5" text-anchor="start">Freezes or thaws directly, swaps the gate,</text>
  <text class="m" x="40" y="740.5" text-anchor="start">reclaims the freeze authority</text>
  <text class="ht" x="40" y="759.5" text-anchor="start">Fee payer</text>
  <rect x="24" y="784" width="452" height="64" rx="12" fill="none" stroke="#059669" stroke-width="3"/>
  <text class="h" x="40" y="812.5" text-anchor="start">Allowlist authority: adds and removes wallets</text>
  <text class="ht" x="40" y="831.5" text-anchor="start">Fee payer</text>
  <text class="g" x="496" y="662" text-anchor="start">OPTIONAL, NOT USED HERE</text>
  <rect x="484" y="676" width="452" height="80" rx="12" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="h" x="500" y="703.0" text-anchor="start">Auditor key</text>
  <text class="m" x="500" y="722.0" text-anchor="start">Optional encryption key for Confidential</text>
  <text class="m" x="500" y="741.0" text-anchor="start">Balances, not a signer</text>
  <rect x="484" y="768" width="452" height="80" rx="12" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="7 6"/>
  <text class="h" x="500" y="804.5" text-anchor="start">Hook program</text>
  <text class="m" x="500" y="823.5" text-anchor="start">Invoked on every transfer when a hook is set</text>
</svg>
