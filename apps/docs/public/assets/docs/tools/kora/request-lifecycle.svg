<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title">
  <title id="title">How a transaction moves through a Kora node, and which part of kora.toml governs each stage</title>
  <style>
    .label{fill:#f8fafc;font:600 21px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.label-small{fill:#f8fafc;font:600 17px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.meta{fill:#a8b3c2;font:15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.mono{fill:#a8b3c2;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}.mono-sm{fill:#a8b3c2;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace}.edge{fill:#a8b3c2;font:600 13px Diatype,Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.3px}.hdr{fill:#a8b3c2;font:600 14px Diatype,Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.9px}.beta{fill:#a78bfa;font:700 11px Diatype,Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.9px}.line,.arrow{fill:none;stroke:#a8b3c2;stroke-width:2}.rule{fill:none;stroke:#a8b3c2;stroke-width:1;opacity:.3}
  </style>

  <text class="hdr" x="40" y="38">REQUEST PATH</text>
  <text class="hdr" x="700" y="38">WHAT YOU CONFIGURE</text>

  <!-- spine connectors -->
  <path class="line" d="M255 140V174M255 284V318M255 424V452M255 522V556M255 626V643M145 643H366M145 643V660M366 643V660"/>
  <path class="arrow" d="M248 164L255 174L262 164M248 308L255 318L262 308M248 442L255 452L262 442M248 546L255 556L262 546M138 650L145 660L152 650M359 650L366 660L373 650"/>

  <!-- config connectors -->
  <path class="line" d="M700 229H470M700 368H470M700 677H600V487H470M700 777H575V591H470"/>
  <path class="arrow" d="M480 222L470 229L480 236M480 361L470 368L480 375M480 480L470 487L480 494M480 584L470 591L480 598"/>
  <text class="edge" x="585" y="219" text-anchor="middle">gates access</text>
  <text class="edge" x="585" y="358" text-anchor="middle">accepts or rejects</text>
  <text class="edge" x="537" y="477" text-anchor="middle">extra checks</text>
  <text class="edge" x="537" y="581" text-anchor="middle">signing key</text>

  <!-- 1 client -->
  <g>
    <rect x="40" y="70" width="430" height="70" rx="12" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text class="label" x="62" y="102">Client app</text>
    <text class="meta" x="62" y="126">Builds the transaction and the payment instruction</text>
  </g>

  <!-- 2 gateway -->
  <g>
    <rect x="40" y="174" width="430" height="110" rx="12" fill="none" stroke="#8b7cf6" stroke-width="2"/>
    <text class="label" x="62" y="205">Gateway</text>
    <text class="meta" x="62" y="228">1 rate limit → 2 CORS → 3 method allowlist</text>
    <text class="meta" x="62" y="250">4 API key → 5 HMAC → 6 reCAPTCHA</text>
    <text class="beta" x="332" y="250">BETA</text>
    <text class="meta" x="62" y="272">/liveness bypasses all of these</text>
  </g>

  <!-- 3 validation -->
  <g>
    <rect x="40" y="318" width="430" height="106" rx="12" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text class="label" x="62" y="348">Validation</text>
    <text class="meta" x="62" y="371">Program and token allowlists, blocked accounts,</text>
    <text class="meta" x="62" y="391">lamport and signature ceilings, oracle pricing</text>
    <text class="meta" x="62" y="411">Anything kora.toml does not permit is rejected</text>
  </g>

  <!-- 4 plugins -->
  <g>
    <rect x="40" y="452" width="430" height="70" rx="12" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <text class="label" x="62" y="484">Plugins</text>
    <text class="beta" x="148" y="484">BETA</text>
    <text class="meta" x="62" y="507">Optional extra checks you opt into per transaction</text>
  </g>

  <!-- 5 sign -->
  <g>
    <rect x="40" y="556" width="430" height="70" rx="12" fill="none" stroke="#34d399" stroke-width="2"/>
    <text class="label" x="62" y="588">Sign as fee payer</text>
    <text class="meta" x="62" y="611">Your signer signs and pays the SOL network fee</text>
  </g>

  <!-- 6 outcomes -->
  <g>
    <rect x="40" y="660" width="210" height="84" rx="12" fill="none" stroke="#a8b3c2" stroke-width="2"/>
    <text class="label-small" x="52" y="690">Return to client</text>
    <text class="mono" x="52" y="713">signTransaction</text>
    <text class="mono" x="52" y="734">signBundle</text>
    <text class="beta" x="146" y="734">BETA</text>
  </g>
  <g>
    <rect x="262" y="660" width="208" height="84" rx="12" fill="none" stroke="#a8b3c2" stroke-width="2"/>
    <text class="label-small" x="274" y="690">Kora broadcasts</text>
    <text class="mono" x="274" y="713">signAndSendTransaction</text>
    <text class="mono" x="274" y="734">signAndSendBundle</text>
    <text class="beta" x="427" y="734">BETA</text>
  </g>

  <!-- P1 network + access -->
  <g>
    <rect x="700" y="70" width="460" height="230" rx="12" fill="none" stroke="#8b7cf6" stroke-width="2"/>
    <text class="label" x="722" y="102">Network &amp; access</text>
    <text class="mono" x="1138" y="102" text-anchor="end">[kora]</text>
    <text class="mono" x="722" y="134">rate_limit</text>
    <text class="mono" x="722" y="156">cors_allow_origins</text>
    <text class="mono" x="722" y="178">enabled_methods</text>
    <text class="mono" x="722" y="200">auth — api keys, HMAC</text>
    <text class="mono" x="722" y="222">payment_address · cache</text>
    <path class="rule" d="M722 240H1138"/>
    <text class="beta" x="722" y="260">V2.2 BETA</text>
    <text class="mono" x="722" y="283">recaptcha · usage_limit · bundle · lighthouse</text>
  </g>

  <!-- P2 validation -->
  <g>
    <rect x="700" y="318" width="460" height="294" rx="12" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text class="label" x="722" y="351">Validation rules</text>
    <text class="mono" x="1138" y="351" text-anchor="end">[validation]</text>
    <text class="mono" x="722" y="382">allowed_programs · allowed_tokens</text>
    <text class="mono" x="722" y="404">allowed_spl_paid_tokens</text>
    <text class="mono" x="722" y="426">disallowed_accounts</text>
    <text class="mono" x="722" y="448">max_allowed_lamports · max_signatures</text>
    <text class="mono" x="722" y="470">price / price_source</text>
    <rect x="722" y="488" width="416" height="108" rx="10" fill="none" stroke="#a8b3c2" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text class="label-small" x="740" y="515">Fee payer policy</text>
    <text class="mono-sm" x="1122" y="515" text-anchor="end">[validation.fee_payer_policy]</text>
    <text class="mono" x="740" y="543">system · spl_token · token_2022 · alt</text>
    <text class="mono" x="740" y="565">bpf_loader_upgradeable · loader_v4</text>
    <text class="edge" x="740" y="587">Every flag defaults to false — opt in explicitly</text>
  </g>

  <!-- P3 plugins -->
  <g>
    <rect x="700" y="642" width="460" height="70" rx="12" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    <text class="label" x="722" y="675">Plugins</text>
    <text class="beta" x="808" y="675">BETA</text>
    <text class="mono" x="1138" y="675" text-anchor="end">[kora.plugins]</text>
    <text class="mono" x="722" y="700">enabled = ["gas_swap", "deploy_authority"]</text>
  </g>

  <!-- P4 signers -->
  <g>
    <rect x="700" y="742" width="460" height="70" rx="12" fill="none" stroke="#34d399" stroke-width="2"/>
    <text class="label" x="722" y="775">Signers</text>
    <text class="mono" x="1138" y="775" text-anchor="end">signers.toml</text>
    <text class="mono" x="722" y="800">memory · Turnkey · Privy · Vault · pools</text>
  </g>
</svg>
