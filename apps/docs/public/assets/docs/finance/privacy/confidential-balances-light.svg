<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Confidential Balances</title>
  <desc id="desc">Public sender and recipient accounts exchange an encrypted amount. Solana verifies a zero-knowledge proof, and an optional auditor key can decrypt transfer amounts.</desc>
  <defs>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" fill="#7c3aed"/></marker>
  </defs>
  <style>
    text{font-family:Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.heading{fill:#172033;font-size:28px;font-weight:600}.label{fill:#172033;font-size:19px;font-weight:600}.meta{fill:#5b6678;font-size:15px}.mono{fill:#7c3aed;font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace}.eyebrow{fill:#5b6678;font-size:13px;font-weight:600;letter-spacing:2.5px}.connector{fill:none;stroke:#667085;stroke-width:2;stroke-linecap:round}.violet{fill:none;stroke:#7c3aed;stroke-width:2}.green{fill:none;stroke:#059669;stroke-width:2}.blue{fill:none;stroke:#0284c7;stroke-width:2}
  </style>

  <text class="eyebrow" x="600" y="28" text-anchor="middle">TOKEN 2022</text>
  <text class="heading" x="600" y="64" text-anchor="middle">Confidential Balances</text>
  <text class="meta" x="600" y="91" text-anchor="middle">public accounts · encrypted balances and amounts</text>

  <g>
    <rect x="54" y="176" width="270" height="150" rx="16" class="connector"/>
    <text class="label" x="189" y="218" text-anchor="middle">Sender account</text>
    <text class="meta" x="189" y="250" text-anchor="middle">address · public</text>
    <text class="mono" x="189" y="286" text-anchor="middle">balance · encrypted</text>
  </g>

  <path d="M324 251H438" class="violet" marker-end="url(#arrow-violet)"/>
  <g>
    <rect x="438" y="190" width="324" height="122" rx="16" class="violet"/>
    <text class="label" x="600" y="235" text-anchor="middle">Confidential transfer</text>
    <text class="mono" x="600" y="272" text-anchor="middle">amount · encrypted</text>
  </g>
  <path d="M762 251H876" class="violet" marker-end="url(#arrow-violet)"/>

  <g>
    <rect x="876" y="176" width="270" height="150" rx="16" class="connector"/>
    <text class="label" x="1011" y="218" text-anchor="middle">Recipient account</text>
    <text class="meta" x="1011" y="250" text-anchor="middle">address · public</text>
    <text class="mono" x="1011" y="286" text-anchor="middle">balance · encrypted</text>
  </g>

  <g>
    <rect x="774" y="108" width="334" height="58" rx="29" class="green"/>
    <circle cx="808" cy="137" r="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <circle cx="808" cy="133" r="4" fill="none" stroke="#047857" stroke-width="2"/>
    <path d="M808 137V147M808 143H813" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
    <text x="835" y="132" fill="#047857" font-size="16" font-weight="600">Optional auditor key</text>
    <text class="meta" x="835" y="153">decrypts transfer amounts</text>
    <path d="M807 166 694 190" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 7"/>
  </g>

  <path d="M600 312V367" class="connector" stroke-dasharray="4 7"/>
  <g>
    <rect x="326" y="367" width="548" height="92" rx="16" class="blue"/>
    <circle cx="371" cy="413" r="18" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <path d="m363 413 6 6 11-13" fill="none" stroke="#0369a1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="408" y="405">ZK proof verified on Solana</text>
    <text class="meta" x="408" y="433">encrypted state updates without revealing the amount</text>
  </g>
</svg>
