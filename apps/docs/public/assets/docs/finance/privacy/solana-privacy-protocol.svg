<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Solana Privacy Protocol</title>
  <desc id="desc">A permissionless Default Ring and policy-controlled Custom Rings move encrypted balances across rings in one Solana transaction. Custom Rings can grant policy-defined auditor visibility.</desc>
  <defs>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" fill="#a78bfa"/></marker>
  </defs>
  <style>
    text{font-family:Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.heading{fill:#f8fafc;font-size:28px;font-weight:600}.label{fill:#f8fafc;font-size:18px;font-weight:600}.meta{fill:#a8b3c2;font-size:14px}.eyebrow{fill:#a8b3c2;font-size:13px;font-weight:600;letter-spacing:2.5px}.ring{fill:none;stroke-width:2}.node{fill:none;stroke-width:2}.transfer{fill:none;stroke:#a78bfa;stroke-width:2;stroke-linecap:round;stroke-dasharray:6 7}.green{fill:none;stroke:#34d399;stroke-width:2}
  </style>

  <text class="eyebrow" x="600" y="28" text-anchor="middle">PROGRAMMABLE ONCHAIN PRIVACY</text>
  <text class="heading" x="600" y="64" text-anchor="middle">Solana Privacy Protocol</text>
  <text class="meta" x="600" y="91" text-anchor="middle">encrypted balances · configurable visibility · native settlement</text>

  <g>
    <circle cx="208" cy="310" r="111" class="ring" stroke="#38bdf8" stroke-dasharray="3 8" opacity=".7"/>
    <circle cx="208" cy="310" r="93" class="ring" stroke="#38bdf8"/>
    <g class="node" stroke="#7dd3fc">
      <circle cx="178" cy="280" r="8"/><circle cx="238" cy="280" r="8"/><circle cx="178" cy="340" r="8"/><circle cx="238" cy="340" r="8"/>
      <path d="M186 280H230M178 288V332M238 288V332M186 340H230M184 286 232 334M232 286 184 334" opacity=".7"/>
    </g>
    <text class="label" x="208" y="440" text-anchor="middle">Default Ring</text>
    <text class="meta" x="208" y="465" text-anchor="middle">permissionless · confidential</text>
  </g>

  <path d="M324 310H476" class="transfer" marker-start="url(#arrow-violet)" marker-end="url(#arrow-violet)"/>
  <text x="400" y="281" fill="#c4b5fd" font-size="13" font-weight="600" text-anchor="middle">PRIVATE CROSS RING</text>

  <g>
    <circle cx="600" cy="310" r="111" class="ring" stroke="#a78bfa" stroke-dasharray="3 8" opacity=".8"/>
    <circle cx="600" cy="310" r="93" class="ring" stroke="#a78bfa"/>
    <g class="node" stroke="#c4b5fd">
      <circle cx="570" cy="280" r="8" fill="#4c1d95"/><circle cx="630" cy="280" r="8" fill="#4c1d95"/><circle cx="570" cy="340" r="8" fill="#4c1d95"/><circle cx="630" cy="340" r="8" fill="#4c1d95"/>
      <path d="M578 280H622M570 288V332M630 288V332M578 340H622M576 286 624 334M624 286 576 334" opacity=".8"/>
    </g>
    <text class="label" x="600" y="440" text-anchor="middle">Custom Ring</text>
    <text class="meta" x="600" y="465" text-anchor="middle">policy controlled · confidential or anonymous</text>
  </g>

  <path d="M724 310H876" class="transfer" marker-start="url(#arrow-violet)" marker-end="url(#arrow-violet)"/>
  <text x="800" y="281" fill="#c4b5fd" font-size="13" font-weight="600" text-anchor="middle">PRIVATE CROSS RING</text>

  <g>
    <circle cx="992" cy="310" r="111" class="ring" stroke="#34d399" stroke-dasharray="3 8" opacity=".7"/>
    <circle cx="992" cy="310" r="93" class="ring" stroke="#34d399"/>
    <g class="node" stroke="#6ee7b7">
      <circle cx="962" cy="280" r="8"/><circle cx="1022" cy="280" r="8"/><circle cx="962" cy="340" r="8"/><circle cx="1022" cy="340" r="8"/>
      <path d="M970 280H1014M962 288V332M1022 288V332M970 340H1014M968 286 1016 334M1016 286 968 334" opacity=".7"/>
    </g>
    <text class="label" x="992" y="440" text-anchor="middle">Other Ring</text>
    <text class="meta" x="992" y="465" text-anchor="middle">interoperable</text>
  </g>

  <g>
    <rect x="738" y="115" width="338" height="50" rx="25" class="green"/>
    <circle cx="772" cy="140" r="14" fill="#14372d" stroke="#34d399" stroke-width="2"/>
    <circle cx="772" cy="136" r="4" fill="none" stroke="#6ee7b7" stroke-width="2"/>
    <path d="M772 140V150M772 146H777" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
    <text x="799" y="135" fill="#6ee7b7" font-size="16" font-weight="600">Optional auditor access</text>
    <text class="meta" x="799" y="156">visibility defined by Custom Ring policy</text>
    <path d="M781 165 674 212" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 7"/>
  </g>

  <rect x="240" y="510" width="720" height="50" rx="14" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <text class="label" x="600" y="541" text-anchor="middle">one Solana transaction · native settlement</text>
</svg>
