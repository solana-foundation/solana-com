<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Private Channels</title>
  <desc id="desc">A private channel sits inside an institution-controlled perimeter with view, approve, freeze, and move permissions. External observers cannot inspect channel activity, while an institution may grant auditor visibility. Value moves to and from Solana mainnet.</desc>
  <defs>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" fill="#7c3aed"/></marker>
  </defs>
  <style>
    text{font-family:Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.heading{fill:#172033;font-size:28px;font-weight:600}.label{fill:#172033;font-size:18px;font-weight:600}.meta{fill:#5b6678;font-size:14px}.eyebrow{fill:#5b6678;font-size:13px;font-weight:600;letter-spacing:2.5px}.connector{fill:none;stroke:#667085;stroke-width:2;stroke-linecap:round}.violet{fill:none;stroke:#7c3aed;stroke-width:2}.green{fill:none;stroke:#059669;stroke-width:2}
  </style>

  <text class="eyebrow" x="600" y="28" text-anchor="middle">INSTITUTION OPERATED</text>
  <text class="heading" x="600" y="64" text-anchor="middle">Private Channels</text>
  <text class="meta" x="600" y="91" text-anchor="middle">private execution · institution-defined controls · Solana settlement</text>

  <g>
    <rect x="50" y="116" width="756" height="292" rx="24" class="violet" stroke-dasharray="7 8"/>
    <text x="78" y="148" fill="#7c3aed" font-size="13" font-weight="600" letter-spacing="2">INSTITUTION PERIMETER</text>

    <path d="M234 208 374 242M234 318 374 276M680 208 644 235M680 318 644 283" class="connector"/>

    <g>
      <rect x="92" y="182" width="142" height="52" rx="12" class="connector"/>
      <text class="label" x="163" y="215" text-anchor="middle">View</text>
    </g>
    <g>
      <rect x="92" y="292" width="142" height="52" rx="12" class="connector"/>
      <text class="label" x="163" y="325" text-anchor="middle">Approve</text>
    </g>
    <g>
      <rect x="680" y="182" width="94" height="52" rx="12" class="connector"/>
      <text class="label" x="727" y="215" text-anchor="middle">Freeze</text>
    </g>
    <g>
      <rect x="680" y="292" width="94" height="52" rx="12" class="connector"/>
      <text class="label" x="727" y="325" text-anchor="middle">Move</text>
    </g>

    <g>
      <rect x="374" y="205" width="270" height="108" rx="16" class="violet"/>
      <text class="label" x="509" y="250" text-anchor="middle">Private channel</text>
      <text class="meta" x="509" y="280" text-anchor="middle">private · instant · no set transaction fee</text>
    </g>
    <text class="meta" x="428" y="374" text-anchor="middle">permissions defined by the operating institution</text>
  </g>

  <g>
    <circle cx="984" cy="176" r="24" fill="none" stroke="#667085" stroke-width="2"/>
    <circle cx="984" cy="168" r="6" fill="#667085"/>
    <path d="M971 187c7-9 19-9 26 0" fill="none" stroke="#667085" stroke-width="2" stroke-linecap="round"/>
    <path d="M806 190 954 177" class="connector" stroke-dasharray="5 7"/>
    <text class="label" x="984" y="223" text-anchor="middle">External observers</text>
    <text class="meta" x="984" y="248" text-anchor="middle">cannot inspect channel activity</text>
  </g>

  <g>
    <circle cx="984" cy="310" r="24" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <circle cx="984" cy="303" r="6" fill="none" stroke="#047857" stroke-width="2"/>
    <path d="M984 309V325M984 318H991" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
    <path d="M806 322 954 311" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 7"/>
    <text x="984" y="357" fill="#047857" font-size="18" font-weight="600" text-anchor="middle">Auditor view</text>
    <text class="meta" x="984" y="382" text-anchor="middle">granted by the institution</text>
  </g>

  <path d="M509 408V450" class="violet" marker-start="url(#arrow-violet)" marker-end="url(#arrow-violet)"/>
  <text class="meta" x="544" y="436">value moves to and from mainnet</text>
  <rect x="74" y="454" width="1052" height="50" rx="14" fill="none" stroke="#0284c7" stroke-width="2"/>
  <text class="label" x="600" y="485" text-anchor="middle">Solana mainnet</text>
</svg>
