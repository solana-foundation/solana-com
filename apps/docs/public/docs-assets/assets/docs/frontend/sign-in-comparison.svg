<svg data-sol-type="1" xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title"><style id="sol-diagram-fonts">@font-face{font-family:"Diatype";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}</style>
  <title id="title">Signing in with a transaction takes several RPC round trips and a network fee; signing an off-chain message takes one wallet prompt and a local signature check</title>
  <style>
    .label{fill:#f2f2f3;font:600 21px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.label-small{fill:#f2f2f3;font:600 17px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.meta{fill:#a1a1aa;font:15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.mono{fill:#a1a1aa;font:14px ui-monospace,SFMono-Regular,Menlo,monospace}.mono-sm{fill:#a1a1aa;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace}.edge{fill:#a1a1aa;font:600 13px Diatype,Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.3px}.hdr{fill:#a1a1aa;font:600 14px Diatype,Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.9px}.good{fill:#a1a1aa;font:600 15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.warn{fill:#a1a1aa;font:600 15px Diatype,Inter,ui-sans-serif,system-ui,sans-serif}.line,.arrow{fill:none;stroke:#a1a1aa;stroke-width:2.18}.rule{fill:none;stroke:#a1a1aa;stroke-width:2.18;opacity:.3}
  </style>
  <text class="hdr" x="40" y="40">SIGN-IN TRANSACTION</text>
  <g>
    <rect x="40" y="62" width="160" height="86" rx="13.95" fill="none" stroke="#a1a1aa" stroke-width="2.18"/>
    <text class="label-small" x="58" y="94">Build</text>
    <text class="meta" x="58" y="120">Fetch a blockhash</text>
  </g>
  <text class="mono-sm" x="120.0" y="172" text-anchor="middle">getLatestBlockhash</text>
  <path class="line" d="M200 105H232"/>
  <path class="arrow" d="M222 98L232 105L222 112"/>
  <g>
    <rect x="232" y="62" width="160" height="86" rx="13.95" fill="none" stroke="#b78aff" stroke-width="2.18"/>
    <text class="label-small" x="250" y="94">Sign</text>
    <text class="meta" x="250" y="120">Opaque bytes</text>
  </g>
  <path class="line" d="M392 105H424"/>
  <path class="arrow" d="M414 98L424 105L414 112"/>
  <g>
    <rect x="424" y="62" width="160" height="86" rx="13.95" fill="none" stroke="#a1a1aa" stroke-width="2.18"/>
    <text class="label-small" x="442" y="94">Simulate</text>
    <text class="meta" x="442" y="120">RPC call</text>
  </g>
  <text class="mono-sm" x="504.0" y="172" text-anchor="middle">simulateTransaction</text>
  <path class="line" d="M584 105H616"/>
  <path class="arrow" d="M606 98L616 105L606 112"/>
  <g>
    <rect x="616" y="62" width="160" height="86" rx="13.95" fill="none" stroke="#a1a1aa" stroke-width="2.18"/>
    <text class="label-small" x="634" y="94">Send</text>
    <text class="meta" x="634" y="120">RPC call</text>
  </g>
  <text class="mono-sm" x="696.0" y="172" text-anchor="middle">sendTransaction</text>
  <path class="line" d="M776 105H808"/>
  <path class="arrow" d="M798 98L808 105L798 112"/>
  <g>
    <rect x="808" y="62" width="160" height="86" rx="13.95" fill="none" stroke="#a1a1aa" stroke-width="2.18"/>
    <text class="label-small" x="826" y="94">Confirm</text>
    <text class="meta" x="826" y="120">Poll until landed</text>
  </g>
  <text class="mono-sm" x="888.0" y="172" text-anchor="middle">getSignatureStatuses</text>
  <path class="line" d="M968 105H1000"/>
  <path class="arrow" d="M990 98L1000 105L990 112"/>
  <g>
    <rect x="1000" y="62" width="160" height="86" rx="13.95" fill="none" stroke="#71717a" stroke-width="2.18"/>
    <text class="label-small" x="1018" y="94">Verify</text>
    <text class="meta" x="1018" y="120">Server checks</text>
  </g>
  <text class="warn" x="40" y="212">Network fee · RPC round trips · waits for confirmation · no readable message</text>
  <path class="rule" d="M40 240H1160"/>
  <text class="hdr" x="40" y="282">OFF-CHAIN MESSAGE</text>
  <g>
    <rect x="40" y="304" width="352" height="86" rx="13.95" fill="none" stroke="#a1a1aa" stroke-width="2.18"/>
    <text class="label-small" x="58" y="336">Challenge</text>
    <text class="meta" x="58" y="362">Server issues a message with a nonce</text>
  </g>
  <path class="line" d="M392 347H424"/>
  <path class="arrow" d="M414 340L424 347L414 354"/>
  <g>
    <rect x="424" y="304" width="352" height="86" rx="13.95" fill="none" stroke="#a1a1aa" stroke-width="2.18"/>
    <text class="label-small" x="442" y="336">Sign</text>
    <text class="meta" x="442" y="362">Wallet shows the text, user signs</text>
  </g>
  <path class="line" d="M776 347H808"/>
  <path class="arrow" d="M798 340L808 347L798 354"/>
  <g>
    <rect x="808" y="304" width="352" height="86" rx="13.95" fill="none" stroke="#a1a1aa" stroke-width="2.18"/>
    <text class="label-small" x="826" y="336">Verify</text>
    <text class="meta" x="826" y="362">Server checks the Ed25519 signature</text>
  </g>
  <text class="good" x="40" y="428">No fee · no RPC calls · one wallet prompt · readable on the device</text>
  <rect x="900" y="24" width="14" height="14" rx="13.95" fill="none" stroke="#a1a1aa" stroke-width="2.18"/>
  <text class="edge" x="922" y="36">RPC round trip</text>
  <rect x="1040" y="24" width="14" height="14" rx="13.95" fill="none" stroke="#71717a" stroke-width="2.18"/>
  <text class="edge" x="1062" y="36">Local step</text>
</svg>
