<svg xmlns="http://www.w3.org/2000/svg" data-sol-drawn="hand" data-sol-type="1" viewBox="0 0 336 426" width="336" height="426" role="img" aria-label="Choosing between Token ACL and a transfer hook. A rule that depends on the holder fits frozen-by-default accounts with Token ACL, at no cost per transfer. A rule that depends on the transfer needs a transfer hook, which runs on every transfer, for example for lockups, size limits, or holder caps." font-family="Diatype, Inter, ui-sans-serif, system-ui, sans-serif"><style id="sol-diagram-fonts">@font-face{font-family:"Diatype";font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:"Diatype";font-weight:500 700;src:url(data:font/woff2;base64,) format("woff2")}</style>
