<rect x="16.5" y="16.5" width="303" height="41" rx="21" fill="#0a0a0b" stroke="#3f3f46" stroke-width="1"/>
<text x="32" y="41.55" font-size="13" font-weight="500" fill="#f2f2f3">The rule depends on</text>
<text x="40" y="82.2" font-size="12" fill="#a1a1aa">the holder</text>
<rect x="40.5" y="90.5" width="279" height="77" rx="8" fill="#0a0a0b" stroke="#b78aff" stroke-width="1.25"/>
<text x="56" y="115.55" font-size="13" font-weight="500" fill="#f2f2f3">Frozen by default + Token ACL</text>
<text x="56" y="133.2" font-size="12" fill="#a1a1aa">A qualifying wallet thaws itself</text>
<text x="56" y="151.2" font-size="12" fill="#a1a1aa">No cost per transfer</text>
<text x="40" y="192.2" font-size="12" fill="#a1a1aa">the transfer</text>
<rect x="40.5" y="200.5" width="279" height="77" rx="8" fill="#0a0a0b" stroke="#3f3f46" stroke-width="1"/>
<text x="56" y="225.55" font-size="13" font-weight="500" fill="#f2f2f3">Transfer hook</text>
<text x="56" y="243.2" font-size="12" fill="#a1a1aa">Runs on every transfer and can reject it</text>
<text x="56" y="261.2" font-size="12" fill="#a1a1aa">Compute on every transfer</text>
<text x="60" y="300.2" font-size="12" fill="#a1a1aa">for example</text>
