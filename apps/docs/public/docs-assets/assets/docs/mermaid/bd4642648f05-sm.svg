<text x="56" y="339.55" font-size="13" font-weight="500" fill="#f2f2f3">Rules about the transfer</text>
<text x="56" y="357.2" font-size="12" fill="#a1a1aa">Lockups that expire per tranche</text>
<text x="56" y="375.2" font-size="12" fill="#a1a1aa">Limits on transfer size</text>
<text x="56" y="393.2" font-size="12" fill="#a1a1aa">Holder counts under a statutory cap</text>
