services:
  postgres:
    image: postgres:16-alpine
    container_name: breakpoint-awards-postgres
    environment:
      POSTGRES_DB: breakpoint_awards
      POSTGRES_USER: breakpoint
      POSTGRES_PASSWORD: breakpoint
    ports:
      - "54329:5432"
    volumes:
      - breakpoint-awards-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakpoint -d breakpoint_awards"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  breakpoint-awards-postgres:
