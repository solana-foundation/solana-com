<svg preserveAspectRatio="xMidYMid meet" style="display: block;" width="111.456" height="582.427" viewBox="0 0 111.456 582.427" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>Jin Mao Tower</title>
<style>
  .jin-mao-light {
    animation: jin-mao-window 8s ease-in-out infinite;
  }

  .jin-mao-light:nth-child(3n + 1) {
    animation-delay: -2.5s;
  }

  .jin-mao-light:nth-child(3n + 2) {
    animation-delay: -5s;
  }

  .jin-mao-beacon {
    animation: jin-mao-beacon 4.6s ease-in-out infinite;
  }

  @keyframes jin-mao-window {
    0%,
    100% {
      opacity: 0.16;
    }
    48% {
      opacity: 0.62;
    }
  }

  @keyframes jin-mao-beacon {
    0%,
    76%,
    100% {
      opacity: 0.12;
    }
    84% {
      opacity: 0.85;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .jin-mao-light,
    .jin-mao-beacon {
      animation: none;
    }
  }
</style>
