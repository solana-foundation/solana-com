<svg
  xmlns="http://www.w3.org/2000/svg"
  width="133.289"
  height="858.732"
  viewBox="0 0 133.289 858.732"
  fill="none"
  preserveAspectRatio="xMidYMid meet"
>
  <title>Shanghai Tower</title>
  <style>
    .shanghai-tower-facade {
      animation: shanghai-tower-shimmer 12s ease-in-out infinite;
    }

    .shanghai-tower-facade:nth-child(2) {
      animation-delay: -4s;
    }

    .shanghai-tower-facade:nth-child(3) {
      animation-delay: -8s;
    }

    .shanghai-tower-beacon {
      animation: shanghai-tower-beacon 4.2s ease-in-out infinite;
    }

    @keyframes shanghai-tower-shimmer {
      0%,
      100% {
        opacity: 0.14;
        stroke-dashoffset: 0;
      }
      50% {
        opacity: 0.52;
        stroke-dashoffset: -110;
      }
    }

    @keyframes shanghai-tower-beacon {
      0%,
      78%,
      100% {
        opacity: 0.12;
      }
      86% {
        opacity: 0.9;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .shanghai-tower-facade,
      .shanghai-tower-beacon {
        animation: none;
      }
    }
  </style>

  <defs>
    <linearGradient
      id="shanghai-tower-body"
      x1="3"
      y1="428"
      x2="130"
      y2="428"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#2D1B49" />
      <stop offset="0.48" stop-color="#392258" />
      <stop offset="1" stop-color="#170A24" />
    </linearGradient>
    <linearGradient
      id="shanghai-tower-glass"
      x1="30"
      y1="140"
      x2="103"
      y2="790"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#76509A" stop-opacity="0.52" />
      <stop offset="0.5" stop-color="#4A2C6D" stop-opacity="0.24" />
      <stop offset="1" stop-color="#241238" stop-opacity="0.08" />
    </linearGradient>
    <clipPath id="shanghai-tower-clip">
      <use href="#shanghai-tower-silhouette" />
    </clipPath>
  </defs>

  <path
    id="shanghai-tower-silhouette"
    d="M62.7 0H70.6V76.5C88.4 92.6 99.1 121.2 102.9 160.4C108.1 214.2 100.7 254.1 111.2 314.7C121.9 376.4 115.5 424.7 124 489.8C132.4 554.6 120.5 619.7 127.5 693.1L133.289 858.732H0L6.2 741.3C12.9 677.9 5.2 620.3 12.4 554.4C19.7 487.5 12.9 430.9 21.5 364.2C30.1 297.5 23.5 245.2 31.1 190.1C38 140.2 48.2 98.3 62.7 76.5V0Z"
    fill="url(#shanghai-tower-body)"
  />

  <g clip-path="url(#shanghai-tower-clip)">
    <path
      d="M48 91C83 151 42 226 76 294C111 365 59 432 91 505C121 574 76 653 104 736C115 769 119 807 121 859H74C76 813 73 777 62 741C37 657 78 589 49 515C20 441 69 375 38 303C10 237 49 166 27 111L48 91Z"
      fill="url(#shanghai-tower-glass)"
    />
    <g
      fill="none"
      stroke="#9368B6"
      stroke-linecap="round"
      stroke-width="1.2"
      stroke-dasharray="10 18"
    >
      <path class="shanghai-tower-facade" d="M39 103C79 183 37 251 75 324C112 395 57 467 91 544C118 607 77 688 106 770" />
      <path class="shanghai-tower-facade" d="M58 82C94 166 53 237 88 309C121 378 74 450 105 525C126 578 99 649 116 715" />
      <path class="shanghai-tower-facade" d="M24 177C55 243 22 313 55 380C89 449 45 520 76 592C98 643 69 711 91 785" />
    </g>
    <path
      d="M24 226C48 235 82 234 107 220M17 365C48 374 89 373 119 357M12 520C45 529 91 527 126 511M8 683C45 692 94 690 128 674"
      stroke="#5F3D80"
      stroke-width="1.15"
      stroke-opacity="0.38"
    />
  </g>

  <path d="M58 91H76L70.6 76.5H62.7L58 91Z" fill="#4A2D6C" />
  <circle class="shanghai-tower-beacon" cx="66.65" cy="7" r="3" fill="#A673CD" />
</svg>
