<svg
  xmlns="http://www.w3.org/2000/svg"
  width="493"
  height="500.494"
  viewBox="0 0 493 500.494"
  fill="none"
  preserveAspectRatio="xMidYMid meet"
>
  <style>
    #ferris-wheel-rotor,
    .ferris-wheel-carriage {
      animation-duration: 72s;
      animation-iteration-count: infinite;
      animation-timing-function: linear;
      will-change: transform;
    }

    #ferris-wheel-rotor {
      animation-name: ferris-wheel-turn;
      transform-box: view-box;
      transform-origin: 246.5px 246.5px;
    }

    .ferris-wheel-carriage {
      animation-name: ferris-wheel-level-carriage;
      transform-origin: 0 0;
    }

    @keyframes ferris-wheel-turn {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes ferris-wheel-level-carriage {
      to {
        transform: rotate(-360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #ferris-wheel-rotor,
      .ferris-wheel-carriage {
        animation: none;
      }
    }
  </style>

  <defs>
    <linearGradient
      id="ferris-wheel-gradient"
      x1="20"
      y1="110"
      x2="473"
      y2="390"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#352052" />
      <stop offset="0.52" stop-color="#291742" />
      <stop offset="1" stop-color="#190B27" />
    </linearGradient>

    <linearGradient
      id="ferris-wheel-highlight"
      x1="246.5"
      y1="38"
      x2="246.5"
      y2="455"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#432866" />
      <stop offset="0.55" stop-color="#2B1845" />
      <stop offset="1" stop-color="#1B0C2A" />
    </linearGradient>

    <filter
      id="ferris-wheel-soft-shadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="170%"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#0B0412" flood-opacity="0.28" />
    </filter>

    <line
      id="ferris-wheel-spoke"
      x1="246.5"
      y1="216.5"
      x2="246.5"
      y2="50.5"
    />

    <g id="ferris-wheel-carriage-shape">
      <circle cy="0" r="3.5" fill="url(#ferris-wheel-highlight)" />
      <path
        d="M0 2.5V9.5M-8 10L-5.5 4.5M8 10L5.5 4.5"
        stroke="url(#ferris-wheel-gradient)"
        stroke-width="3"
        stroke-linecap="round"
      />
      <path
        d="M-13 10.5Q-13 8 -10.5 8H10.5Q13 8 13 10.5L15 25.5Q15.5 30 10.5 30H-10.5Q-15.5 30 -15 25.5Z"
        fill="url(#ferris-wheel-gradient)"
        filter="url(#ferris-wheel-soft-shadow)"
      />
      <path
        d="M-9.5 13H9.5L10.5 21.5H-10.5L-9.5 13Z"
        fill="#0E0718"
        fill-opacity="0.48"
      />
      <path
        d="M0 13V21.5M-12.5 25.5H12.5"
        stroke="#5A397D"
        stroke-opacity="0.52"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    </g>
  </defs>

  <g id="ferris-wheel-a-frame" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path
      d="M246.5 250L177.5 493.5M246.5 250L315.5 493.5"
      stroke="#12081E"
      stroke-opacity="0.25"
      stroke-width="22"
    />
    <path
      d="M246.5 250L177.5 493.5M246.5 250L315.5 493.5"
      stroke="url(#ferris-wheel-gradient)"
      stroke-width="16"
    />
    <path
      d="M190.5 445.5H302.5"
      stroke="#12081E"
      stroke-opacity="0.24"
      stroke-width="15"
    />
    <path d="M190.5 445.5H302.5" stroke="url(#ferris-wheel-gradient)" stroke-width="10" />
    <path d="M165 494.5H191M302 494.5H328" stroke="url(#ferris-wheel-gradient)" stroke-width="12" />
  </g>

  <g id="ferris-wheel-rotor">
    <g
      id="ferris-wheel-spokes"
      stroke="url(#ferris-wheel-gradient)"
      stroke-width="5"
      stroke-linecap="round"
    >
      <use href="#ferris-wheel-spoke" />
      <use href="#ferris-wheel-spoke" transform="rotate(30 246.5 246.5)" />
      <use href="#ferris-wheel-spoke" transform="rotate(60 246.5 246.5)" />
      <use href="#ferris-wheel-spoke" transform="rotate(90 246.5 246.5)" />
      <use href="#ferris-wheel-spoke" transform="rotate(120 246.5 246.5)" />
      <use href="#ferris-wheel-spoke" transform="rotate(150 246.5 246.5)" />
      <use href="#ferris-wheel-spoke" transform="rotate(180 246.5 246.5)" />
      <use href="#ferris-wheel-spoke" transform="rotate(210 246.5 246.5)" />
      <use href="#ferris-wheel-spoke" transform="rotate(240 246.5 246.5)" />
      <use href="#ferris-wheel-spoke" transform="rotate(270 246.5 246.5)" />
      <use href="#ferris-wheel-spoke" transform="rotate(300 246.5 246.5)" />
      <use href="#ferris-wheel-spoke" transform="rotate(330 246.5 246.5)" />
    </g>

    <circle
      id="ferris-wheel-inner-rim"
      cx="246.5"
      cy="246.5"
      r="196"
      stroke="url(#ferris-wheel-gradient)"
      stroke-width="3"
    />
    <circle
      id="ferris-wheel-outer-rim"
      cx="246.5"
      cy="246.5"
      r="207.5"
      stroke="url(#ferris-wheel-highlight)"
      stroke-width="7"
    />

    <g id="ferris-wheel-carriages">
      <g transform="translate(246.5 39)">
        <g class="ferris-wheel-carriage"><use href="#ferris-wheel-carriage-shape" /></g>
      </g>
      <g transform="translate(350.25 66.8)">
        <g class="ferris-wheel-carriage"><use href="#ferris-wheel-carriage-shape" /></g>
      </g>
      <g transform="translate(426.2 142.75)">
        <g class="ferris-wheel-carriage"><use href="#ferris-wheel-carriage-shape" /></g>
      </g>
      <g transform="translate(454 246.5)">
        <g class="ferris-wheel-carriage"><use href="#ferris-wheel-carriage-shape" /></g>
      </g>
      <g transform="translate(426.2 350.25)">
        <g class="ferris-wheel-carriage"><use href="#ferris-wheel-carriage-shape" /></g>
      </g>
      <g transform="translate(350.25 426.2)">
        <g class="ferris-wheel-carriage"><use href="#ferris-wheel-carriage-shape" /></g>
      </g>
      <g transform="translate(246.5 454)">
        <g class="ferris-wheel-carriage"><use href="#ferris-wheel-carriage-shape" /></g>
      </g>
      <g transform="translate(142.75 426.2)">
        <g class="ferris-wheel-carriage"><use href="#ferris-wheel-carriage-shape" /></g>
      </g>
      <g transform="translate(66.8 350.25)">
        <g class="ferris-wheel-carriage"><use href="#ferris-wheel-carriage-shape" /></g>
      </g>
      <g transform="translate(39 246.5)">
        <g class="ferris-wheel-carriage"><use href="#ferris-wheel-carriage-shape" /></g>
      </g>
      <g transform="translate(66.8 142.75)">
        <g class="ferris-wheel-carriage"><use href="#ferris-wheel-carriage-shape" /></g>
      </g>
      <g transform="translate(142.75 66.8)">
        <g class="ferris-wheel-carriage"><use href="#ferris-wheel-carriage-shape" /></g>
      </g>
    </g>

    <g id="ferris-wheel-hub">
      <circle cx="246.5" cy="246.5" r="31" fill="#130920" fill-opacity="0.2" />
      <circle cx="246.5" cy="246.5" r="27" fill="url(#ferris-wheel-highlight)" />
      <path
        d="M246.5 225V268M225 246.5H268M231.3 231.3L261.7 261.7M261.7 231.3L231.3 261.7"
        stroke="#65408A"
        stroke-opacity="0.34"
        stroke-width="3"
        stroke-linecap="round"
      />
      <circle cx="246.5" cy="246.5" r="10" fill="#190C29" stroke="#6A448E" stroke-opacity="0.45" stroke-width="2" />
    </g>
  </g>
</svg>
