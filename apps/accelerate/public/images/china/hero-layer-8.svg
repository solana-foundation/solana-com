<svg
  xmlns="http://www.w3.org/2000/svg"
  width="493"
  height="500.494"
  viewBox="0 0 493 500.494"
  fill="none"
  preserveAspectRatio="xMidYMid meet"
>
  <style>
    #ferris-wheel-rotor,
    .ferris-wheel-carriage {
      animation-duration: 72s;
      animation-iteration-count: infinite;
      animation-timing-function: linear;
      will-change: transform;
    }

    #ferris-wheel-rotor {
      animation-name: ferris-wheel-turn;
      transform-box: view-box;
      transform-origin: 246.5px 246.5px;
    }

    .ferris-wheel-carriage {
      animation-name: ferris-wheel-level-carriage;
      transform-origin: 0 0;
    }

    @keyframes ferris-wheel-turn {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes ferris-wheel-level-carriage {
      to {
        transform: rotate(-360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #ferris-wheel-rotor,
      .ferris-wheel-carriage {
        animation: none;
      }
    }
  </style>

  <defs>
    <linearGradient
      id="ferris-wheel-gradient"
      x1="24"
      y1="90"
      x2="469"
      y2="416"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#3B245A" />
      <stop offset="0.5" stop-color="#291742" />
      <stop offset="1" stop-color="#180B26" />
    </linearGradient>

    <linearGradient
      id="ferris-wheel-highlight"
      x1="246.5"
      y1="25"
      x2="246.5"
      y2="468"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#543574" />
      <stop offset="0.52" stop-color="#33204F" />
      <stop offset="1" stop-color="#1D0D2D" />
    </linearGradient>

    <radialGradient
      id="ferris-wheel-ring-gradient"
      cx="246.5"
      cy="246.5"
      r="224"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0.7" stop-color="#231338" />
      <stop offset="0.88" stop-color="#2E1B48" />
      <stop offset="1" stop-color="#432A63" />
    </radialGradient>

    <filter
      id="ferris-wheel-soft-shadow"
      x="-40%"
      y="-50%"
      width="180%"
      height="210%"
      color-interpolation-filters="sRGB"
    >
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#0A0311" flood-opacity="0.34" />
    </filter>

    <g id="ferris-wheel-truss-bay">
      <path d="M246.5 41.5L216.806 78.098M246.5 41.5L276.194 78.098" />
      <path d="M246.5 41.5V75.5" stroke-width="1.2" stroke-opacity="0.72" />
    </g>

    <g id="ferris-wheel-carriage-shape" filter="url(#ferris-wheel-soft-shadow)">
      <path
        d="M-2.5 -8.5H2.5L4 -5.5H-4L-2.5 -8.5Z"
        fill="url(#ferris-wheel-highlight)"
      />
      <rect
        x="-7.5"
        y="-5.5"
        width="15"
        height="12"
        rx="5.5"
        fill="url(#ferris-wheel-gradient)"
        stroke="#654687"
        stroke-width="1.25"
      />
      <path
        d="M-4.75 -2.5H4.75V3.4H-4.75V-2.5ZM0 -2.5V3.4"
        fill="#0E0718"
        fill-opacity="0.5"
        stroke="#725095"
        stroke-opacity="0.48"
        stroke-width="0.8"
      />
      <path d="M-3.5 7H3.5" stroke="#392254" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </defs>

